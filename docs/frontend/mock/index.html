            if (!laneTooltip || !laneTooltipDot || !laneTooltipText) return;
            const project = getCurrentProject();
            const doc = getCurrentDocument();
            if (!project || !doc) {
              hideLaneTooltip();
              return;
            }
            const ann = doc.annotations.find((item) => item.id === annId);
            if (!ann) {
              hideLaneTooltip();
              return;
            }
            const label = project.labels.find((item) => item.id === ann.labelId) || null;
            laneTooltipDot.style.background = label ? label.color || "#8b94a0" : "#8b94a0";
            laneTooltipText.textContent = label ? label.name : "Unknown";
            laneTooltip.classList.add("show");
            laneTooltip.setAttribute("aria-hidden", "false");
            const rect = laneTooltip.getBoundingClientRect();
            let left = clientX + 14;
            let top = clientY + 16;
            if (left + rect.width > window.innerWidth - 8) left = window.innerWidth - rect.width - 8;
            if (top + rect.height > window.innerHeight - 8) top = window.innerHeight - rect.height - 8;
            if (left < 8) left = 8;
            if (top < 8) top = 8;
            laneTooltip.style.left = String(left) + "px";
            laneTooltip.style.top = String(top) + "px";
          };

          const syncUnderlineHover = (nextLaneAnnId) => {
            if (state.hoverLaneAnnId === nextLaneAnnId) return;
            state.hoverLaneAnnId = nextLaneAnnId;
            render();
          };

          const bindOverlayUnderlineEvents = () => {
            if (!overlay) return;
            overlay.querySelectorAll("[data-overlay-ann-id]").forEach((line) => {
              line.addEventListener("mouseenter", (event) => {
                const annId = line.getAttribute("data-overlay-ann-id");
                syncUnderlineHover(annId);
                showLaneTooltip(annId, event.clientX, event.clientY);
              });
              line.addEventListener("mousemove", (event) => {
                const annId = line.getAttribute("data-overlay-ann-id");
                showLaneTooltip(annId, event.clientX, event.clientY);
              });
              line.addEventListener("mouseleave", () => {
                syncUnderlineHover(null);
                hideLaneTooltip();
              });
              line.addEventListener("click", (event) => {
                event.stopPropagation();
                const selection = window.getSelection();
                if (selection && !selection.isCollapsed) return;
                const annId = line.getAttribute("data-overlay-ann-id");
                const doc = getCurrentDocument();
                if (!doc) return;
                const ann = doc.annotations.find((item) => item.id === annId);
                if (!ann) return;
                state.selectedAnnotationId = ann.id;
                state.focusedLabelId = ann.labelId;
                render();
              });
            });
          };
          bindOverlayUnderlineEvents();

          const clearAnnotationSelection = () => {
            if (state.selectedAnnotationId === null) return;
            state.selectedAnnotationId = null;
            render();
          };

          const canvasWrap = docText.closest(".canvas-wrap");
          if (canvasWrap) {
            canvasWrap.addEventListener("click", (event) => {
              const selection = window.getSelection();
              if (selection && !selection.isCollapsed) return;
              const underline = event.target.closest("[data-overlay-ann-id]");
              if (underline && canvasWrap.contains(underline)) return;
              const segment = event.target.closest("[data-primary-ann-id]");
              if (segment && docText.contains(segment)) return;
              clearAnnotationSelection();
            });
          }

          docText.addEventListener("mousemove", (event) => {
            const selection = window.getSelection();
            if (selection && !selection.isCollapsed) {
              syncUnderlineHover(null);
              hideLaneTooltip();
              return;
            }
            const segment = event.target.closest("[data-primary-ann-id]");
            if (!segment || !docText.contains(segment)) {
              syncUnderlineHover(null);
              hideLaneTooltip();
              return;
            }
            syncUnderlineHover(null);
            const doc = getCurrentDocument();
            if (!doc) {
              hideLaneTooltip();
              return;
            }
            const primaryAnnId = segment.getAttribute("data-primary-ann-id");
            const primaryAnn = doc.annotations.find((item) => item.id === primaryAnnId);
            if (!primaryAnn || primaryAnn.labelId !== state.focusedLabelId) {
              hideLaneTooltip();
              return;
            }
            showLaneTooltip(primaryAnn.id, event.clientX, event.clientY);
          });

          docText.addEventListener("mouseleave", () => {
            syncUnderlineHover(null);
            hideLaneTooltip();
          });

          docText.addEventListener("mouseup", () => {
            const selection = window.getSelection();
            if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return;
            const range = selection.getRangeAt(0);
            if (!docText.contains(range.startContainer) || !docText.contains(range.endContainer)) return;
            const doc = getCurrentDocument();
            const label = getFocusedLabel();
            if (!doc || !label) return;
            let start = getTextOffset(docText, range.startContainer, range.startOffset);
            let end = getTextOffset(docText, range.endContainer, range.endOffset);
            if (start > end) {
              const temp = start;
              start = end;
              end = temp;
            }
            if (start === end) return;
            const spanText = doc.text.slice(start, end);
            if (!spanText.trim()) {
              selection.removeAllRanges();
              return;
            }
            if (hasOverlap(doc.annotations, label.id, start, end)) {
              selection.removeAllRanges();
              showFlash("同一ラベルの重複範囲は作成できない");
              return;
            }
            const newAnnotation = {
              id: makeId("ann"),
              labelId: label.id,
              start,
              end,
              spanText,
              comment: "",
              status: "pending",
              meta: {},
            };
            doc.annotations.push(newAnnotation);
            touchDoc(doc);
            setDirty();
            state.selectedAnnotationId = newAnnotation.id;
            selection.removeAllRanges();
            pushWorkspaceHistory();
            render();
          });
        }
      }

      window.addEventListener("hashchange", render);
      if (!location.hash) location.hash = "#/projects";
      render();
    </script>
  </body>
</html>
