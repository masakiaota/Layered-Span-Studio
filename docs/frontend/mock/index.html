<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layered Span Studio Mock</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --panel: #f0eee9;
        --panel-2: #ece9e3;
        --surface: #ffffff;
        --line: #d6d1c7;
        --text: #1f2226;
        --muted: #6b7380;
        --accent: #12735f;
        --accent-soft: #d8eee8;
        --danger: #9f3131;
        --danger-soft: #f9dada;
        --ok: #256f3a;
        --ok-soft: #def3e4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at 20% 10%, #fdfbf6 0%, var(--bg) 50%, #ebe8e0 100%);
        color: var(--text);
        font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      }

      .app-shell {
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
        background: #f9f7f2;
        gap: 16px;
      }

      .topbar-left,
      .topbar-center,
      .topbar-right {
        display: flex;
        align-items: center;
      }

      .topbar-center {
        flex: 1;
        justify-content: center;
      }

      .topbar-right {
        justify-content: flex-end;
        min-width: 110px;
      }

      .segment-control {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: #ece6db;
        border: 1px solid #d8d1c4;
        border-radius: 14px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
      }

      .segment-btn {
        border: none;
        background: transparent;
        color: #5d6672;
        border-radius: 10px;
        padding: 9px 14px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        transition:
          background-color 120ms ease,
          color 120ms ease,
          box-shadow 120ms ease;
      }

      .segment-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.4);
      }

      .segment-btn.active {
        background: #fffdf8;
        color: #1b2a37;
        box-shadow:
          0 1px 2px rgba(33, 41, 52, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .small {
        color: var(--muted);
        font-size: 13px;
      }

      .btn {
        border: 1px solid #b9c0c9;
        background: #fff;
        color: #24313f;
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
      }

      .btn:hover {
        background: #f5f8fb;
      }

      .btn-primary {
        border-color: #1f7f69;
        background: #1f7f69;
        color: #fff;
      }

      .btn-primary:hover {
        background: #1a6f5b;
      }

      .btn-danger {
        border-color: #b74242;
        background: #b74242;
        color: #fff;
      }

      .btn-danger:hover {
        background: #9f3131;
      }

      .btn-quiet {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 4px 2px;
        border-radius: 6px;
      }

      .btn-quiet:hover {
        background: transparent;
        color: var(--text);
      }

      .projects-wrap {
        max-width: 1040px;
        margin: 24px auto 0;
        padding: 0 24px 32px;
      }

      .projects-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .projects-title {
        margin: 0;
        font-size: 32px;
        line-height: 1.1;
      }

      .projects-lead {
        margin: 8px 0 0;
        max-width: 620px;
        color: #54606e;
        font-size: 14px;
        line-height: 1.6;
      }

      .projects-empty {
        margin-top: 24px;
        padding: 40px 32px;
        border: 1px dashed #cbbfae;
        border-radius: 22px;
        background:
          radial-gradient(circle at top right, rgba(255, 248, 233, 0.9), transparent 36%),
          linear-gradient(180deg, #fcfaf5 0%, #f4efe6 100%);
        text-align: center;
      }

      .projects-empty h3 {
        margin: 0;
        font-size: 22px;
      }

      .projects-empty p {
        margin: 10px auto 0;
        max-width: 520px;
        color: #5b6470;
        line-height: 1.6;
      }

      .projects-empty .actions {
        margin-top: 18px;
        display: flex;
        justify-content: center;
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      .project-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 170px;
      }

      .project-title {
        font-size: 18px;
        font-weight: 700;
      }

      .project-desc {
        color: #394250;
        line-height: 1.5;
        font-size: 14px;
      }

      .project-meta {
        margin-top: auto;
        display: flex;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .workspace-wrap {
        padding: 16px;
        display: grid;
        grid-template-columns: 320px minmax(520px, 1fr) 380px;
        gap: 14px;
        height: calc(100vh - 74px);
      }

      .panel {
        background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
        border: 1px solid var(--line);
        border-radius: 14px;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .panel-head {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .doc-panel-head {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .doc-panel-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .doc-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .doc-search-shell {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid #d8d1c4;
        border-radius: 12px;
        background:
          radial-gradient(circle at top right, rgba(255, 250, 238, 0.9), transparent 42%),
          rgba(255, 255, 255, 0.62);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
      }

      .doc-search-icon {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #ece6db;
        color: #51606f;
        font-size: 15px;
      }

      .doc-search-input {
        min-width: 0;
      }

      .doc-search-input input {
        width: 100%;
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        padding: 0;
      }

      .doc-search-input input:focus {
        outline: none;
      }

      .doc-search-input input::placeholder {
        color: #7b8490;
      }

      .doc-list {
        overflow: auto;
        padding: 8px 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .doc-list-banner {
        padding: 10px 12px;
        border: 1px solid #d7cfbf;
        border-radius: 12px;
        background:
          linear-gradient(180deg, rgba(255, 249, 238, 0.94) 0%, rgba(246, 239, 226, 0.96) 100%);
        color: #354252;
      }

      .doc-list-banner strong {
        display: block;
        font-size: 13px;
      }

      .doc-list-banner p {
        margin: 6px 0 0;
        color: #5f6976;
        font-size: 12px;
        line-height: 1.55;
      }

      .doc-list-banner .actions,
      .doc-empty-state .actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .doc-item {
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 9px 10px;
        background: #f7f4ef;
        cursor: pointer;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .doc-item.active {
        border-color: #7e8ea2;
        background: #e7edf3;
      }

      .doc-name {
        font-size: 13px;
        font-weight: 700;
      }

      .doc-snippet {
        margin-top: 4px;
        color: #47515f;
        font-size: 12px;
        line-height: 1.5;
      }

      .doc-snippet mark {
        background: linear-gradient(180deg, rgba(255, 230, 147, 0.34) 0%, rgba(255, 214, 94, 0.7) 100%);
        color: inherit;
        padding: 0 2px;
        border-radius: 4px;
      }

      .doc-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }

      .doc-empty-state {
        padding: 20px 16px;
        border: 1px dashed #ccbfa8;
        border-radius: 16px;
        background:
          radial-gradient(circle at top right, rgba(255, 248, 235, 0.92), transparent 42%),
          linear-gradient(180deg, #fbf7ee 0%, #f3ecde 100%);
      }

      .doc-empty-state strong {
        display: block;
        font-size: 15px;
      }

      .doc-empty-state p {
        margin: 8px 0 0;
        color: #5c6673;
        font-size: 13px;
        line-height: 1.6;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .pill.pending {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: #f1b3b3;
      }

      .pill.verified {
        background: var(--ok-soft);
        color: var(--ok);
        border-color: #a8dfb6;
      }

      .center-panel {
        padding: 10px 12px 12px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .label-strip {
        display: flex;
        align-items: center;
        gap: 4px;
        overflow-x: auto;
        padding: 4px;
        margin-bottom: 8px;
        background: #ece6db;
        border: 1px solid #d8d1c4;
        border-radius: 16px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
      }

      .label-btn {
        border: none;
        background: transparent;
        color: var(--btn-text, #24313f);
        border-radius: 12px;
        padding: 9px 14px;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
        transition:
          background-color 120ms ease,
          color 120ms ease,
          box-shadow 120ms ease;
      }

      .label-btn:hover {
        background: rgba(255, 255, 255, 0.45);
      }

      .label-btn.active {
        background: #fffdf8;
        color: var(--btn-active-text, #1f2732);
        box-shadow:
          0 1px 2px rgba(33, 41, 52, 0.08),
          inset 0 0 0 3px var(--btn-active-border, #314356),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .canvas-wrap {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      .center-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .canvas-help {
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .doc-text {
        line-height: 2.2;
        font-size: 17px;
        white-space: pre-wrap;
        user-select: text;
        word-break: break-word;
        position: relative;
        z-index: 1;
      }

      .doc-stage {
        position: relative;
      }

      .annotation-segment {
        border-radius: 0;
        cursor: text;
        position: relative;
        transition: box-shadow 120ms ease, background 120ms ease;
      }

      .annotation-segment.has-underline {
        cursor: pointer;
      }

      .annotation-segment.has-marker {
        cursor: pointer;
      }

      .annotation-segment.selected {
      }

      .doc-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .overlay-underline {
        position: absolute;
        pointer-events: auto;
        background: transparent;
      }

      .overlay-underline::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        height: var(--line-thickness, 3px);
        background: var(--line-color, rgba(153, 153, 153, 1));
        border-radius: 2px;
        pointer-events: none;
      }

      .overlay-selection {
        position: absolute;
        box-shadow: 0 0 0 2px rgba(24, 33, 44, 0.72);
        pointer-events: none;
      }

      .lane-hover-tooltip {
        position: fixed;
        display: none;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid #b5c0cd;
        background: rgba(255, 255, 255, 0.96);
        color: #223347;
        font-size: 11px;
        line-height: 1.3;
        z-index: 36;
        pointer-events: none;
        box-shadow: 0 4px 12px rgba(23, 32, 47, 0.18);
      }

      .lane-hover-tooltip.show {
        display: inline-flex;
      }

      .lane-hover-tooltip-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        display: inline-block;
      }

      .doc-hover-tooltip {
        position: fixed;
        display: none;
        width: min(440px, calc(100vw - 16px));
        max-width: 440px;
        max-height: min(420px, calc(100vh - 16px));
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid #cfd7e0;
        background: rgba(255, 253, 249, 0.98);
        color: #223347;
        font-size: 12px;
        line-height: 1.6;
        z-index: 37;
        pointer-events: none;
        box-shadow: 0 18px 36px rgba(23, 32, 47, 0.2);
        backdrop-filter: blur(10px);
      }

      .doc-hover-tooltip.show {
        display: block;
      }

      .doc-hover-tooltip-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }

      .doc-hover-tooltip-title {
        font-size: 13px;
        font-weight: 700;
      }

      .doc-hover-tooltip-meta {
        margin-bottom: 10px;
        color: #6d7782;
        font-size: 11px;
      }

      .doc-hover-tooltip-body {
        overflow: auto;
        max-height: min(300px, calc(100vh - 130px));
        color: #2f3540;
      }

      .doc-hover-tooltip-body mark {
        background: linear-gradient(180deg, rgba(255, 230, 147, 0.32) 0%, rgba(255, 214, 94, 0.72) 100%);
        color: inherit;
        padding: 0 2px;
        border-radius: 4px;
      }

      .doc-hover-tooltip-muted {
        color: #7c8692;
      }

      .related-hover-tooltip {
        position: fixed;
        display: none;
        width: min(420px, calc(100vw - 16px));
        max-width: 420px;
        max-height: min(440px, calc(100vh - 16px));
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid #cbd4de;
        background: rgba(255, 253, 248, 0.98);
        color: #223347;
        font-size: 12px;
        line-height: 1.55;
        z-index: 37;
        pointer-events: none;
        box-shadow: 0 16px 32px rgba(23, 32, 47, 0.2);
        backdrop-filter: blur(10px);
      }

      .related-hover-tooltip.show {
        display: block;
      }

      .related-hover-tooltip-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 6px;
      }

      .related-hover-tooltip-labels {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        flex-wrap: wrap;
      }

      .related-hover-tooltip-dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        display: inline-block;
        flex: 0 0 auto;
      }

      .related-hover-tooltip-label {
        font-size: 12px;
        font-weight: 700;
      }

      .related-hover-tooltip-doc {
        color: #6d7782;
        font-size: 11px;
      }

      .related-hover-tooltip-context {
        color: #2f3540;
      }

      .related-hover-tooltip-context mark {
        background: linear-gradient(180deg, rgba(255, 230, 147, 0.32) 0%, rgba(255, 214, 94, 0.72) 100%);
        color: inherit;
        padding: 0 2px;
        border-radius: 4px;
      }

      .related-hover-tooltip-meta {
        margin-bottom: 8px;
        color: #6d7782;
        font-size: 11px;
      }

      .related-hover-tooltip-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: min(320px, calc(100vh - 120px));
        overflow: auto;
        padding-right: 2px;
      }

      .related-hover-tooltip-case {
        border-top: 1px solid rgba(203, 212, 222, 0.72);
        padding-top: 10px;
      }

      .related-hover-tooltip-case:first-child {
        border-top: none;
        padding-top: 0;
      }

      .related-hover-tooltip-case-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }

      .right-panel {
        min-height: 0;
        overflow: hidden;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .right-panel-tabs {
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        background: #ece6db;
        border: 1px solid #d8d1c4;
        border-radius: 14px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
      }

      .right-panel-tab {
        border: none;
        background: transparent;
        color: #5d6672;
        border-radius: 10px;
        padding: 9px 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        transition:
          background-color 120ms ease,
          color 120ms ease,
          box-shadow 120ms ease;
      }

      .right-panel-tab.active {
        background: #fffdf8;
        color: #1b2a37;
        box-shadow:
          0 1px 2px rgba(33, 41, 52, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .right-panel-body {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .right-panel-view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .card {
        background: #f8f6f1;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
      }

      .card h4 {
        margin: 0 0 8px;
        font-size: 14px;
      }

      .card p {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 13px;
        font-weight: 700;
      }

      .field textarea,
      .field select,
      .field input {
        width: 100%;
        border: 1px solid #bdc4cc;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
        background: #fff;
      }

      .field textarea {
        min-height: 84px;
        resize: vertical;
      }

      .field input[type="checkbox"] {
        width: auto;
      }

      .field input[type="color"] {
        width: 56px;
        height: 32px;
        padding: 0;
      }

      .anno-groups {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .annotation-list-view {
        min-height: 0;
      }

      .annotation-edit-card {
        flex: 0 0 auto;
      }

      .annotation-edit-card-head {
        margin-bottom: 8px;
      }

      .annotation-edit-toggle {
        width: 100%;
        border: none;
        background: #efeade;
        color: #2f3540;
        border-radius: 10px;
        padding: 9px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .annotation-edit-toggle:focus-visible {
        outline: 2px solid #6f8fb7;
        outline-offset: 2px;
      }

      .annotation-edit-toggle-icon {
        font-size: 16px;
        line-height: 1;
      }

      .annotation-edit-card-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .annotation-edit-card.collapsed .annotation-edit-card-body {
        display: none;
      }

      .annotation-edit-card.collapsed {
        padding-bottom: 10px;
      }

      .annotation-list-card {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .annotation-list-card-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding-right: 2px;
      }

      .related-view {
        min-height: 0;
      }

      .guideline-card-compact p {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .related-section {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .related-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

        if (docOverlayFrameToken) return;

          if (!docText) return;
          renderDocOverlay(docText);

        if (!docOverlayResizeObserver) {
          docOverlayResizeObserver = new ResizeObserver(() => {

        if (docOverlayObservedElement === docText) return;

          .split(pattern)
          .map((part) => {
            if (!part) return "";
            const normalizedPart = normalizeSearchText(part);

          .join("");

      function getDocumentSearchSnippet(doc, query) {

        let matchIndex = -1;
        let matchLength = 0;
        for (const token of rawTokens) {

            matchLength = token.length;

        }

        const excerptRadius = 24;
        const start = Math.max(0, matchIndex - excerptRadius);
        const end = Math.min(text.length, matchIndex + matchLength + excerptRadius);
        const prefix = start > 0 ? "…" : "";
        const suffix = end < text.length ? "…" : "";
        return prefix + highlightSearchTerms(text.slice(start, end), query) + suffix;
      }

      function getDocumentHoverPreviewHtml(doc, query) {
        const text = String((doc && doc.text) || "");
        if (!text) return '<span class="doc-hover-tooltip-muted">本文はまだ空である。</span>';

        const trimmedQuery = String(query || "").trim();
        if (!trimmedQuery) {
          const excerpt = text.slice(0, 180);
          return escapeHtml(excerpt) + (text.length > 180 ? "…" : "");
        }

        const rawTokens = Array.from(
          new Set(
            trimmedQuery
              .split(/\s+/)
              .map((token) => token.trim())
              .filter(Boolean)
          )
        );

        let matchIndex = -1;
        let matchLength = 0;
        for (const token of rawTokens) {
          const idx = text.toLocaleLowerCase("ja").indexOf(token.toLocaleLowerCase("ja"));
          if (idx >= 0) {
            matchIndex = idx;
            matchLength = token.length;
            break;
          }
        }

        if (matchIndex < 0) {
          const fallback = text.slice(0, 180);
          return highlightSearchTerms(fallback + (text.length > 180 ? "…" : ""), query);
        }

        const excerptRadius = 88;
        const start = Math.max(0, matchIndex - excerptRadius);
        const end = Math.min(text.length, matchIndex + matchLength + excerptRadius);
        const prefix = start > 0 ? "…" : "";
        const suffix = end < text.length ? "…" : "";
        return prefix + highlightSearchTerms(text.slice(start, end), query) + suffix;
      }

      function renderDocumentHoverTooltipHtml(doc, query) {
        if (!doc) return "";
        return `
          <div class="doc-hover-tooltip-head">
            <div class="doc-hover-tooltip-title">${escapeHtml(doc.documentName || "")}</div>
            <span class="pill ${escapeHtml(doc.status || "pending")}">${escapeHtml(doc.status || "pending")}</span>
          </div>
          <div class="doc-hover-tooltip-meta">更新: ${escapeHtml(formatDate(doc.updatedAt))}</div>
          <div class="doc-hover-tooltip-body">${getDocumentHoverPreviewHtml(doc, query)}</div>
        `;
      }

      function getSelectedAnnotation() {
        const doc = getCurrentDocument();
        if (!doc) return null;
        return doc.annotations.find((a) => a.id === state.selectedAnnotationId) || null;
      }

      function getFocusedLabel() {
        const project = getCurrentProject();
        if (!project) return null;
        return project.labels.find((l) => l.id === state.focusedLabelId) || null;
      }

      function getAnnotationsInPanelOrder(doc, project) {
        if (!doc || !project) return [];
        const sortBySpanIndex = (left, right) => {
          if (left.start !== right.start) return left.start - right.start;
          if (left.end !== right.end) return left.end - right.end;
          return String(left.id || "").localeCompare(String(right.id || ""));
        };
        const groups = Object.fromEntries(project.labels.map((label) => [label.id, []]));
        const fallback = [];
        doc.annotations.forEach((ann) => {
          if (groups[ann.labelId]) {
            groups[ann.labelId].push(ann);
          } else {
            fallback.push(ann);
          }
        });
        const ordered = [];
        project.labels.forEach((label) => {
          groups[label.id].sort(sortBySpanIndex);
          ordered.push(...groups[label.id]);
        });
        fallback.sort(sortBySpanIndex);
        ordered.push(...fallback);
        return ordered;
      }

      function showFlash(message) {
        state.flash = message;
        render();
        window.setTimeout(() => {
          if (state.flash === message) {
            state.flash = "";
            render();
          }
        }, 1600);
      }

      function touchDoc(doc) {
        doc.updatedAt = Date.now();
        doc.status = "pending";
      }

      function hasOverlap(annotations, labelId, start, end, excludeId) {
        return annotations.some((a) => {
          if (a.id === excludeId) return false;
          if (a.labelId !== labelId) return false;
          return a.start < end && a.end > start;
        });
      }

      function saveCurrentProjectSnapshot() {
        const project = getCurrentProject();
        if (!project) return;
        savedSnapshots[project.id] = deepClone(project);
      }

      function saveChanges() {
        saveCurrentProjectSnapshot();
        state.dirty = false;
        pushWorkspaceHistory();
        showFlash("保存した");
      }

      function submitCurrentDocument() {
        const project = getCurrentProject();
        const doc = getCurrentDocument();
        if (!project || !doc) return;
        const sortedDocs = getSortedDocuments(project);
        const currentIndex = sortedDocs.findIndex((item) => item.id === doc.id);

        doc.status = "verified";
        doc.updatedAt = Date.now();
        doc.annotations.forEach((item) => {
          item.status = "verified";
        });

        let nextPendingDoc = null;
        for (let i = currentIndex + 1; i < sortedDocs.length; i += 1) {
          if (sortedDocs[i].status === "pending") {
            nextPendingDoc = sortedDocs[i];
            break;
          }
        }
        if (!nextPendingDoc) {
          for (let i = 0; i < currentIndex; i += 1) {
            if (sortedDocs[i].status === "pending") {
              nextPendingDoc = sortedDocs[i];
              break;
            }
          }
        }
        if (nextPendingDoc) {
          state.selectedDocId = nextPendingDoc.id;
          state.selectedAnnotationId = null;
        } else {
          const hasCurrentSelection = !!(
            state.selectedAnnotationId &&
            doc.annotations.some((item) => item.id === state.selectedAnnotationId)
          );
          if (!hasCurrentSelection) state.selectedAnnotationId = null;
        }
        state.hoverLaneAnnId = null;

        state.dirty = false;
        saveCurrentProjectSnapshot();
        pushWorkspaceHistory();
        showFlash(
          nextPendingDoc
            ? "Submit完了: verified更新後に次のpending docへ移動した"
            : "Submit完了: Document/Annotationsをverifiedに更新した"
        );
      }

      function restoreCurrentProject() {
        const snapshot = savedSnapshots[state.currentProjectId];
        if (!snapshot) return;
        const idx = state.projects.findIndex((p) => p.id === state.currentProjectId);
        if (idx >= 0) state.projects[idx] = deepClone(snapshot);
      }

      function setDirty() {
        state.dirty = true;
      }

      function createWorkspaceHistoryEntry() {
        const project = getCurrentProject();
        if (!project) return null;
        return {
          project: deepClone(project),
          selectedDocId: state.selectedDocId,
          selectedAnnotationId: state.selectedAnnotationId,
          focusedLabelId: state.focusedLabelId,
          rightPanelTab: state.rightPanelTab,
          annotationEditCollapsed: state.annotationEditCollapsed,
          sortBy: state.sortBy,
          accordionOpen: deepClone(state.accordionOpen),
          dirty: state.dirty,
        };
      }

      function historyEntriesEqual(a, b) {
        return JSON.stringify(a) === JSON.stringify(b);
      }

      function resetWorkspaceHistory() {
        state.undoStack = [];
        state.redoStack = [];
        const initialEntry = createWorkspaceHistoryEntry();
        if (!initialEntry) return;
        state.undoStack.push(initialEntry);
      }

      function pushWorkspaceHistory() {
        const currentEntry = createWorkspaceHistoryEntry();
        if (!currentEntry) return;
        const lastEntry = state.undoStack[state.undoStack.length - 1];
        if (lastEntry && historyEntriesEqual(lastEntry, currentEntry)) return;
        state.undoStack.push(currentEntry);
        if (state.undoStack.length > 100) {
          state.undoStack.splice(0, state.undoStack.length - 100);
        }
        state.redoStack = [];
      }

      function applyWorkspaceHistoryEntry(entry, options) {
        const preserveDocSelection = !!(options && options.preserveDocSelection);
        const currentDocId = state.selectedDocId;
        const projectIndex = state.projects.findIndex((item) => item.id === state.currentProjectId);
        if (projectIndex < 0) return false;
        state.projects[projectIndex] = deepClone(entry.project);
        state.sortBy = entry.sortBy || "created";
        state.selectedDocId = preserveDocSelection ? currentDocId || null : entry.selectedDocId || null;
        state.selectedAnnotationId = entry.selectedAnnotationId || null;
        state.focusedLabelId = entry.focusedLabelId || null;
        state.rightPanelTab = entry.rightPanelTab || "related";
        state.annotationEditCollapsed = !!entry.annotationEditCollapsed;
        state.dirty = !!entry.dirty;
        state.hoverLaneAnnId = null;
        state.showCreateDocModal = false;
        state.showUnsavedDialog = false;
        state.showShortcutModal = false;
        state.pendingDocSwitchId = null;
        state.pendingNavigationHash = null;

        const project = getCurrentProject();
        if (!project) return false;
        const entryDocIdExists = !!(entry.selectedDocId && project.documents.some((doc) => doc.id === entry.selectedDocId));
        if (!project.documents.some((doc) => doc.id === state.selectedDocId)) {
          state.selectedDocId = entryDocIdExists
            ? entry.selectedDocId
            : project.documents[0]
              ? project.documents[0].id
              : null;
        }
        const doc = getCurrentDocument();
        if (!doc || !doc.annotations.some((ann) => ann.id === state.selectedAnnotationId)) {
          state.selectedAnnotationId = null;
        }
        if (!project.labels.some((label) => label.id === state.focusedLabelId)) {
          state.focusedLabelId = project.labels[0] ? project.labels[0].id : null;
        }
        const nextAccordionOpen = {};
        project.labels.forEach((label) => {
          const savedOpen = entry.accordionOpen ? entry.accordionOpen[label.id] : undefined;
          nextAccordionOpen[label.id] = typeof savedOpen === "boolean" ? savedOpen : true;
        });
        state.accordionOpen = nextAccordionOpen;
        return true;
      }

      function undoWorkspace() {
        if (state.undoStack.length <= 1) {
          showFlash("これ以上Undoできない");
          return;
        }
        const currentEntry = state.undoStack.pop();
        if (currentEntry) state.redoStack.push(currentEntry);
        const previousEntry = state.undoStack[state.undoStack.length - 1];
        if (!previousEntry || !applyWorkspaceHistoryEntry(previousEntry, { preserveDocSelection: true })) {
          showFlash("Undoに失敗した");
          return;
        }
        showFlash("Undoした");
      }

      function redoWorkspace() {
        if (state.redoStack.length === 0) {
          showFlash("これ以上Redoできない");
          return;
        }
        const nextEntry = state.redoStack.pop();
        if (!nextEntry) {
          showFlash("Redoに失敗した");
          return;
        }
        state.undoStack.push(nextEntry);
        if (!applyWorkspaceHistoryEntry(nextEntry, { preserveDocSelection: true })) {
          showFlash("Redoに失敗した");
          return;
        }
        showFlash("Redoした");
      }

      function parseHash() {
        const hash = location.hash.replace(/^#/, "");
        if (hash === "" || hash === "/projects") return { view: "projects" };
        const settingsMatch = hash.match(/^\/projects\/([^/]+)\/settings$/);
        if (settingsMatch) return { view: "settings", projectId: decodeURIComponent(settingsMatch[1]) };
        const dataIoMatch = hash.match(/^\/projects\/([^/]+)\/data-io$/);
        if (dataIoMatch) return { view: "settings", projectId: decodeURIComponent(dataIoMatch[1]) };
        const match = hash.match(/^\/projects\/([^/]+)$/);
        if (match) return { view: "workspace", projectId: decodeURIComponent(match[1]) };
        return { view: "projects" };
      }

      function ensureWorkspaceState(projectId) {
        if (state.currentProjectId === projectId) return;
        state.currentProjectId = projectId;
        state.sortBy = "created";
        state.docSearchQuery = "";
        state.createDocPrefillName = "";
        state.rightPanelTab = "related";
        state.annotationEditCollapsed = false;
        state.hoverLaneAnnId = null;
        state.dirty = false;
        state.showCreateDocModal = false;
        state.showUnsavedDialog = false;
        state.showShortcutModal = false;
        state.pendingDocSwitchId = null;
        state.pendingNavigationHash = null;
        state.exportIncludePending = true;
        state.exportIncludeVerified = true;
        state.accordionOpen = {};
        const project = getCurrentProject();
        if (!project) return;
        ensureProjectConfig(project);
        state.selectedDocId = project.documents[0] ? project.documents[0].id : null;
        state.focusedLabelId = project.labels[0] ? project.labels[0].id : null;
        state.selectedAnnotationId = null;
        project.labels.forEach((label) => {
          state.accordionOpen[label.id] = true;
        });
        resetWorkspaceHistory();
      }

      function getSortedDocuments(project) {
        const docs = [...project.documents];
        if (state.sortBy === "created") docs.sort((a, b) => a.createdAt - b.createdAt);
        if (state.sortBy === "pendingFirst")
          docs.sort((a, b) => {
            if (a.status !== b.status) return a.status === "pending" ? -1 : 1;
            return a.createdAt - b.createdAt;
          });
        if (state.sortBy === "updated") docs.sort((a, b) => b.updatedAt - a.updatedAt);
        if (state.sortBy === "name")
          docs.sort((a, b) => a.documentName.localeCompare(b.documentName, "ja"));
        return docs;
      }

      function getVisibleDocuments(project) {
        const docs = getSortedDocuments(project);
        const tokens = getDocSearchTokens(state.docSearchQuery);
        if (tokens.length === 0) return docs;
        return docs.filter((doc) => doesDocumentMatchSearch(doc, tokens));
      }

      function getDocumentPanelState(project) {
        const docs = getVisibleDocuments(project);
        const doc = getCurrentDocument();
        const pendingDocsCount = project.documents.filter((item) => item.status === "pending").length;
        const hasDocSearch = getDocSearchTokens(state.docSearchQuery).length > 0;
        const currentDocHiddenBySearch = !!(doc && hasDocSearch && !docs.some((item) => item.id === doc.id));
        return {
          currentDocHiddenBySearch,
          doc,
          docs,
          hasDocSearch,
          pendingDocsCount,
        };
      }

      function renderDocumentSearchAccessory(panelState) {
        return panelState.hasDocSearch
          ? '<button class="btn btn-quiet" id="doc-search-clear" type="button">クリア</button>'
          : "";
      }

      function renderDocumentListBody(panelState) {
        const docsHtml =
          panelState.docs.length > 0
            ? panelState.docs
                .map((item) => {
                  return `
                    <button
                      class="doc-item ${item.id === state.selectedDocId ? "active" : ""}"
                      data-doc-id="${item.id}"
                      data-doc-preview="true"
                      data-doc-preview-context="${escapeHtmlAttr(renderDocumentHoverTooltipHtml(item, state.docSearchQuery))}"
                    >
                      <div>
                        <div class="doc-name">${escapeHtml(item.documentName)}</div>
                        ${
                          panelState.hasDocSearch
                            ? '<div class="doc-snippet">' + getDocumentSearchSnippet(item, state.docSearchQuery) + "</div>"
                            : ""
                        }
                        <div class="doc-sub">更新: ${formatDate(item.updatedAt)}</div>
                      </div>
                      <span class="pill ${item.status}">${item.status}</span>
                    </button>
                  `;
                })
                .join("")
            : `
              <section class="doc-empty-state">
                <strong>一致する Doc がまだない</strong>
                <p>「${escapeHtml(state.docSearchQuery)}」に合う本文が見つからない。言い回しを変えるか、検索をクリアすると全件に戻る。</p>
                <div class="actions">
                  <button class="btn" id="doc-search-clear-empty">検索をクリア</button>
                  <button class="btn btn-primary" id="doc-search-create-doc">+ Doc を作る</button>
                </div>
              </section>
            `;

        const currentDocSearchBanner = panelState.currentDocHiddenBySearch
          ? `
            <section class="doc-list-banner">
              <strong>現在表示中の Doc は検索結果の外にある</strong>
              <p><code>${escapeHtml(panelState.doc.documentName)}</code> を編集中のまま、一覧は検索結果だけに絞っている。戻りたくなったら検索をクリアすればよい。</p>
              <div class="actions">
                <button class="btn" id="doc-search-show-current">現在 Doc を一覧に出す</button>
                <button class="btn" id="doc-search-clear-banner">検索をクリア</button>
              </div>
            </section>
          `
          : "";

        return currentDocSearchBanner + docsHtml;
      }

      function refreshDocumentPanel(project, options) {
        if (!project) return;
        const panelState = getDocumentPanelState(project);
        const searchAccessory = document.getElementById("doc-search-accessory");
        if (searchAccessory) searchAccessory.innerHTML = renderDocumentSearchAccessory(panelState);
        const docList = document.getElementById("doc-list");
        if (docList) {
          const previousScrollTop = docList.scrollTop;
          docList.innerHTML = renderDocumentListBody(panelState);
          docList.scrollTop = options && options.resetScroll ? 0 : previousScrollTop;
        }
        bindDocumentPanelDynamicControls();
      }

      function buildSegments(text, annotations) {
        const points = new Set([0, text.length]);
        annotations.forEach((item) => {
          points.add(item.start);
          points.add(item.end);
        });
        const sorted = [...points].sort((a, b) => a - b);
        const segments = [];
        for (let i = 0; i < sorted.length - 1; i += 1) {
          const start = sorted[i];
          const end = sorted[i + 1];
          if (start === end) continue;
          const covers = annotations.filter((item) => item.start < end && item.end > start);
          segments.push({ start, end, text: text.slice(start, end), covers });
        }
        return segments;
      }

      function renderDocText(doc, project) {
        if (!doc) {
          state.underlineLaneByAnnId = {};
          state.globalUnderlineReserve = 0;
          return '<p class="small">Documentを選択すると本文が表示される。</p>';
        }
        const labelById = Object.fromEntries(project.labels.map((label) => [label.id, label]));
        const labelOrderById = Object.fromEntries(project.labels.map((label, index) => [label.id, index]));
        const selectedAnnotation = doc.annotations.find((item) => item.id === state.selectedAnnotationId) || null;
        const underlineLaneByAnnId = {};
        let maxUnderlineLane = -1;
        const laneEnds = [];
        doc.annotations
          .filter((item) => item.labelId !== state.focusedLabelId)
          .sort((a, b) => {
            if (a.start !== b.start) return a.start - b.start;
            if (a.end !== b.end) return a.end - b.end;
            const labelDiff = (labelOrderById[a.labelId] || 0) - (labelOrderById[b.labelId] || 0);
            if (labelDiff !== 0) return labelDiff;
            return a.id.localeCompare(b.id);
          })
          .forEach((item) => {
            let laneIndex = 0;
            while (laneIndex < laneEnds.length && laneEnds[laneIndex] > item.start) {
              laneIndex += 1;
            }
            laneEnds[laneIndex] = item.end;
            underlineLaneByAnnId[item.id] = laneIndex;
            if (laneIndex > maxUnderlineLane) maxUnderlineLane = laneIndex;
          });
        const globalReserveBottom =
          maxUnderlineLane >= 0
            ? UNDERLINE_LANE_BASE + maxUnderlineLane * UNDERLINE_LANE_PITCH + UNDERLINE_PADDING_TAIL
            : 0;
        state.underlineLaneByAnnId = underlineLaneByAnnId;
        state.globalUnderlineReserve = globalReserveBottom;
        const segments = buildSegments(doc.text, doc.annotations);
        return segments
          .map((segment) => {
            const raw = escapeHtml(segment.text);
            if (segment.covers.length === 0) return raw;
            const focused = segment.covers.find((item) => item.labelId === state.focusedLabelId) || null;
            const primary = focused || segment.covers[0];
            const markerColor = focused ? (labelById[focused.labelId] || {}).color || "#999999" : "";
            const underlineItems = segment.covers
              .filter((item) => !focused || item.id !== focused.id)
              .sort((a, b) => {
                const laneDiff = (underlineLaneByAnnId[a.id] || 0) - (underlineLaneByAnnId[b.id] || 0);
                if (laneDiff !== 0) return laneDiff;
                if (a.start !== b.start) return a.start - b.start;
                return a.id.localeCompare(b.id);
              });
            const styleParts = [];
            if (markerColor) {
              styleParts.push("background-color:" + hexToRgba(markerColor, 0.34));
            }
            const isSelected = selectedAnnotation
              ? segment.covers.some((item) => item.id === selectedAnnotation.id)
              : false;
            const selectedClass = isSelected ? " selected" : "";
            const selectedStartClass = isSelected && selectedAnnotation && segment.start === selectedAnnotation.start ? " start" : "";
            const selectedEndClass = isSelected && selectedAnnotation && segment.end === selectedAnnotation.end ? " end" : "";
            const markerClass = markerColor ? " has-marker" : "";
            const underlineClass = underlineItems.length > 0 ? " has-underline" : "";
            const underlineAnnIds = underlineItems.map((item) => item.id);
            const coverAnnIds = segment.covers.map((item) => item.id);
            const title = segment.covers
              .map((item) => (labelById[item.labelId] ? labelById[item.labelId].name : "Unknown"))
              .join(", ");
            return (
              '<span class="annotation-segment' +
              selectedClass +
              selectedStartClass +
              selectedEndClass +
              markerClass +
              underlineClass +
              '" data-primary-ann-id="' +
              primary.id +
              '" data-under-ann-ids="' +
              underlineAnnIds.join(",") +
              '" data-cover-ann-ids="' +
              coverAnnIds.join(",") +
              '" style="' +
              styleParts.join(";") +
              '" title="' +
              escapeHtml(title) +
              '">' +
              raw +
              "</span>"
            );
          })
          .join("");
      }

      function contextParts(text, start, end, size) {
        const left = text.slice(Math.max(0, start - size), start);
        const mid = text.slice(start, end);
        const right = text.slice(end, Math.min(text.length, end + size));
        return { left, mid, right };
      }

      function renderAnnotationContextHtml(text, start, end, size) {
        const context = contextParts(text, start, end, size);
        return (
          '<span class="related-context-muted">' +
          escapeHtml(context.left) +
          "</span><mark>" +
          escapeHtml(context.mid) +
          '</mark><span class="related-context-muted">' +
          escapeHtml(context.right) +
          "</span>"
        );
      }

      function renderExtendedAnnotationContextHtml(text, start, end, size) {
        const context = contextParts(text, start, end, size);
        return (
          '<span class="related-context-muted">' +
          escapeHtml(context.left) +
          "</span><mark>" +
          escapeHtml(context.mid) +
          '</mark><span class="related-context-muted">' +
          escapeHtml(context.right) +
          "</span>"
        );
      }

      function renderRelatedHoverTooltipHtml(surfaceText, label, items) {
        if (!Array.isArray(items) || items.length === 0) return "";
        const color = label && label.color ? label.color : "#8b94a0";
        const labelName = label ? label.name : "Unknown";
        const tooltipCasesHtml = items
          .map((item) => `
            <div class="related-hover-tooltip-case">
              <div class="related-hover-tooltip-case-head">
                <div class="related-hover-tooltip-doc">${escapeHtml(item.doc.documentName || "")}</div>
                <span class="pill ${escapeHtml(item.annotation.status || "pending")}">${escapeHtml(
                  item.annotation.status || "pending"
                )}</span>
              </div>
              <div class="related-hover-tooltip-context">${renderExtendedAnnotationContextHtml(
                item.doc.text || "",
                item.annotation.start,
                item.annotation.end,
                56
              )}</div>
            </div>
          `)
          .join("");
        return `
          <div class="related-hover-tooltip-head">
            <div class="related-hover-tooltip-labels">
              <span class="related-hover-tooltip-dot" style="background:${escapeHtml(color)}"></span>
              <span class="related-hover-tooltip-label">${escapeHtml(labelName)}</span>
            </div>
          </div>
          <div class="related-hover-tooltip-meta">${escapeHtml(surfaceText || "")} / ${items.length}件の事例</div>
          <div class="related-hover-tooltip-list">${tooltipCasesHtml}</div>
        `;
      }

      function collectProjectAnnotationEntries(project) {
        if (!project) return [];
        return project.documents.flatMap((doc) =>
          doc.annotations.map((annotation) => ({
            annotation,
            doc,
          }))
        );
      }

      function getSameLabelSurfaceExamples(project, focusedLabel, selectedAnnotation) {
        if (!project || !focusedLabel) return [];
        const entries = collectProjectAnnotationEntries(project)
          .filter((entry) => entry.annotation.labelId === focusedLabel.id)
          .filter((entry) => !selectedAnnotation || entry.annotation.id !== selectedAnnotation.id);

        const deduped = new Map();
        entries.forEach((entry) => {
          const key = normalizeSearchText(entry.annotation.spanText);
          if (!key) return;
          const existing = deduped.get(key);
          if (!existing) {
            deduped.set(key, { ...entry, duplicateCount: 1, duplicates: [entry] });
            return;
          }
          existing.duplicateCount += 1;
          existing.duplicates.push(entry);
          if (existing.annotation.status !== "verified" && entry.annotation.status === "verified") {
            deduped.set(key, { ...entry, duplicateCount: existing.duplicateCount, duplicates: existing.duplicates });
          }
        });

        return [...deduped.values()]
          .sort((left, right) => {
            if (left.annotation.status !== right.annotation.status) {
              return left.annotation.status === "verified" ? -1 : 1;
            }
            return right.doc.updatedAt - left.doc.updatedAt;
          })
          .slice(0, 8);
      }

      function getSameSurfaceAnnotationExamples(project, selectedAnnotation) {
        if (!project || !selectedAnnotation) return [];
        const target = normalizeSearchText(selectedAnnotation.spanText);
        if (!target) return [];
        return collectProjectAnnotationEntries(project)
          .filter((entry) => normalizeSearchText(entry.annotation.spanText) === target)
          .filter((entry) => entry.annotation.id !== selectedAnnotation.id)
          .sort((left, right) => {
            const leftDifferent = left.annotation.labelId !== selectedAnnotation.labelId;
            const rightDifferent = right.annotation.labelId !== selectedAnnotation.labelId;
            if (leftDifferent !== rightDifferent) return leftDifferent ? -1 : 1;
            if (left.annotation.status !== right.annotation.status) {
              return left.annotation.status === "verified" ? -1 : 1;
            }
            return right.doc.updatedAt - left.doc.updatedAt;
          })
          .slice(0, 8);
      }

        return `
