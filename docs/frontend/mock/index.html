<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layered Span Studio Mock</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --panel: #f0eee9;
        --panel-2: #ece9e3;
        --surface: #ffffff;
        --line: #d6d1c7;
        --text: #1f2226;
        --muted: #6b7380;
        --accent: #12735f;
        --accent-soft: #d8eee8;
        --danger: #9f3131;
        --danger-soft: #f9dada;
        --ok: #256f3a;
        --ok-soft: #def3e4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at 20% 10%, #fdfbf6 0%, var(--bg) 50%, #ebe8e0 100%);
        color: var(--text);
        font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      }

      .app-shell {
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
        background: #f9f7f2;
      }

      .brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .small {
        color: var(--muted);
        font-size: 13px;
      }

      .btn {
        border: 1px solid #b9c0c9;
        background: #fff;
        color: #24313f;
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
      }

      .btn:hover {
        background: #f5f8fb;
      }

      .btn-primary {
        border-color: #1f7f69;
        background: #1f7f69;
        color: #fff;
      }

      .btn-primary:hover {
        background: #1a6f5b;
      }

      .btn-danger {
        border-color: #b74242;
        background: #b74242;
        color: #fff;
      }

      .btn-danger:hover {
        background: #9f3131;
      }

      .projects-wrap {
        max-width: 1040px;
        margin: 24px auto 0;
        padding: 0 24px 32px;
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      .project-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 170px;
      }

      .project-title {
        font-size: 18px;
        font-weight: 700;
      }

      .project-desc {
        color: #394250;
        line-height: 1.5;
        font-size: 14px;
      }

      .project-meta {
        margin-top: auto;
        display: flex;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .workspace-wrap {
        padding: 16px;
        display: grid;
        grid-template-columns: 320px minmax(520px, 1fr) 380px;
        gap: 14px;
        height: calc(100vh - 74px);
      }

      .panel {
        background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
        border: 1px solid var(--line);
        border-radius: 14px;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .panel-head {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .doc-list {
        overflow: auto;
        padding: 8px 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .doc-item {
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 9px 10px;
        background: #f7f4ef;
        cursor: pointer;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .doc-item.active {
        border-color: #7e8ea2;
        background: #e7edf3;
      }

      .doc-name {
        font-size: 13px;
        font-weight: 700;
      }

      .doc-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .pill.pending {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: #f1b3b3;
      }

      .pill.verified {
        background: var(--ok-soft);
        color: var(--ok);
        border-color: #a8dfb6;
      }

      .center-panel {
        padding: 10px 12px 12px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .label-strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 8px;
        margin-bottom: 8px;
      }

      .label-btn {
        border: 1px solid var(--btn-border, var(--line));
        background: var(--btn-bg, #fff);
        color: var(--btn-text, #24313f);
        border-radius: 999px;
        padding: 7px 12px;
        white-space: nowrap;
        font-size: 13px;
        cursor: pointer;
      }

      .label-btn.active {
        border-color: var(--btn-active-border, #314356);
        background: var(--btn-active-bg, #dfe6ee);
        font-weight: 700;
      }

      .canvas-wrap {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      .center-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .canvas-help {
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .doc-text {
        line-height: 2.2;
        font-size: 17px;
        white-space: pre-wrap;
        user-select: text;
        word-break: break-word;
        position: relative;
        z-index: 1;
      }

      .doc-stage {
        position: relative;
      }

      .annotation-segment {
        border-radius: 0;
        cursor: text;
        position: relative;
        transition: box-shadow 120ms ease, background 120ms ease;
      }

      .annotation-segment.has-underline {
        cursor: pointer;
      }

      .annotation-segment.has-marker {
        cursor: pointer;
      }

      .annotation-segment.selected {
      }

      .doc-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .overlay-underline {
        position: absolute;
        pointer-events: auto;
        background: transparent;
      }

      .overlay-underline::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        height: var(--line-thickness, 3px);
        background: var(--line-color, rgba(153, 153, 153, 1));
        border-radius: 2px;
        pointer-events: none;
      }

      .overlay-selection {
        position: absolute;
        border: 1.5px solid rgba(36, 50, 67, 0.6);
        pointer-events: none;
        box-sizing: border-box;
      }

      .lane-hover-tooltip {
        position: fixed;
        display: none;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid #b5c0cd;
        background: rgba(255, 255, 255, 0.96);
        color: #223347;
        font-size: 11px;
        line-height: 1.3;
        z-index: 36;
        pointer-events: none;
        box-shadow: 0 4px 12px rgba(23, 32, 47, 0.18);
      }

      .lane-hover-tooltip.show {
        display: inline-flex;
      }

      .lane-hover-tooltip-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        display: inline-block;
      }

      .right-panel {
        min-height: 0;
        overflow: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .card {
        background: #f8f6f1;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
      }

      .card h4 {
        margin: 0 0 8px;
        font-size: 14px;
      }

      .card p {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 13px;
        font-weight: 700;
      }

      .field textarea,
      .field select,
      .field input {
        width: 100%;
        border: 1px solid #bdc4cc;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
        background: #fff;
      }

      .field textarea {
        min-height: 84px;
        resize: vertical;
      }

      .field input[type="checkbox"] {
        width: auto;
      }

      .field input[type="color"] {
        width: 56px;
        height: 32px;
        padding: 0;
      }

      .anno-groups {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .anno-group {
        border: 1px solid var(--group-border, #cbc4b7);
        border-radius: 10px;
        overflow: hidden;
        background: var(--group-bg, #fbfaf6);
      }

      .anno-group-head {
        width: 100%;
        border: none;
        background: var(--group-head-bg, #efeade);
        color: var(--group-head-text, #2f3540);
        padding: 9px 10px;
        text-align: left;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
        cursor: pointer;
      }

      .anno-list {
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .anno-item {
        border: 1px solid var(--anno-border, #d4cec2);
        border-left: 4px solid var(--anno-accent, #8b94a0);
        border-radius: 8px;
        background: #fff;
        padding: 8px;
        cursor: pointer;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        align-items: center;
      }

      .anno-item.active {
        border-color: var(--anno-active-border, #3c4d64);
        background: var(--anno-active-bg, #e6edf5);
      }

      .anno-context {
        font-size: 12px;
        color: #2f3540;
      }

      .anno-context-muted {
        color: #8b94a0;
      }

      .anno-context-focus {
        color: #1f2430;
        font-weight: 700;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 14, 18, 0.48);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }

      .modal {
        width: min(520px, 92vw);
        background: #fff;
        border-radius: 14px;
        border: 1px solid #bfc7cf;
        padding: 16px;
      }

      .modal h3 {
        margin: 0 0 10px;
      }

      .modal .actions {
        margin-top: 12px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .shortcut-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .shortcut-item {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 10px;
        align-items: center;
        font-size: 13px;
      }

      .shortcut-keys {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        color: #223347;
        background: #eef2f7;
        border: 1px solid #c5ccd5;
        border-radius: 6px;
        padding: 4px 6px;
        white-space: nowrap;
      }

      .flash {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: #1e2e41;
        color: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 12px;
        z-index: 30;
      }

      @media (max-width: 1400px) {
        .workspace-wrap {
          grid-template-columns: 280px minmax(400px, 1fr) 330px;
        }

        .doc-text {
          font-size: 15px;
        }
      }

      @media (max-width: 1080px) {
        .workspace-wrap {
          grid-template-columns: 1fr;
          height: auto;
        }

        .panel {
          min-height: 320px;
        }

        .doc-text {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-shell"></div>
    <div id="lane-hover-tooltip" class="lane-hover-tooltip" aria-hidden="true">
      <span class="lane-hover-tooltip-dot" id="lane-hover-tooltip-dot"></span>
      <span id="lane-hover-tooltip-text"></span>
    </div>
    <script>
      function deepClone(value) {
        if (typeof structuredClone === "function") return structuredClone(value);
        return JSON.parse(JSON.stringify(value));
      }

      function makeId(prefix) {
        return prefix + "-" + Math.random().toString(36).slice(2, 9);
      }

      function escapeHtml(input) {
        return input
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function formatDate(ts) {
        const d = new Date(ts);
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }

      function hexToRgba(hex, alpha) {
        const value = hex.replace("#", "");
        const r = parseInt(value.slice(0, 2), 16);
        const g = parseInt(value.slice(2, 4), 16);
        const b = parseInt(value.slice(4, 6), 16);
        return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";
      }

      function getLabelButtonStyle(label, isActive) {
        const color = label.color || "#8b94a0";
        if (isActive) {
          return (
            "--btn-border:" +
            color +
            ";--btn-bg:" +
            hexToRgba(color, 0.24) +
            ";--btn-text:#1f2732;--btn-active-border:" +
            color +
            ";--btn-active-bg:" +
            hexToRgba(color, 0.24) +
            ";"
          );
        }
        return (
          "--btn-border:" +
          hexToRgba(color, 0.45) +
          ";--btn-bg:" +
          hexToRgba(color, 0.11) +
          ";--btn-text:#2d3744;"
        );
      }

      function getGroupStyle(label) {
        const color = label.color || "#8b94a0";
        return (
          "--group-border:" +
          hexToRgba(color, 0.5) +
          ";--group-bg:" +
          hexToRgba(color, 0.1) +
          ";--group-head-bg:" +
          hexToRgba(color, 0.22) +
          ";--group-head-text:#1f2732;"
        );
      }

      function getAnnoItemStyle(label) {
        const color = label.color || "#8b94a0";
        return (
          "--anno-accent:" +
          color +
          ";--anno-border:" +
          hexToRgba(color, 0.45) +
          ";--anno-active-border:" +
          color +
          ";--anno-active-bg:" +
          hexToRgba(color, 0.2) +
          ";"
        );
      }

      const UNDERLINE_LANE_BASE = 3;
      const UNDERLINE_LANE_PITCH = 5;
      const UNDERLINE_HIT_HALF = 3;
      const UNDERLINE_IDLE_ALPHA = 0.82;
      const UNDERLINE_DIM_ALPHA = 0.42;
      const UNDERLINE_PADDING_TAIL = 3;
      const EXPORT_FORMAT = "layered-span-studio/export";
      const EXPORT_VERSION = "1.0";

      function parseCsvIds(value) {
        return String(value || "")
          .split(",")
          .map((id) => id.trim())
          .filter(Boolean);
      }

      const baseText =
        "58歳男性。3日前から続く発熱（最高38.6℃）、乾いた咳、全身倦怠感を主訴に受診した。来院時バイタルは体温38.2℃、血圧146/88 mmHg、脈拍102/分、SpO2 95%（室内気）で、聴診では右下肺野に軽度の湿性ラ音を認めた。血液検査では白血球11,200/μL、CRP 8.4 mg/dL、HbA1c 7.1%で、胸部X線では右下葉に浸潤影を認め、市中肺炎と診断した。既往歴として2型糖尿病、高血圧症、脂質異常症があり、内服はメトホルミン500mg 1日2回、アムロジピン5mg 1日1回、ロスバスタチン2.5mg 就寝前。治療としてレボフロキサシン500mg 1日1回を5日分処方し、解熱時のみアセトアミノフェン500mgを頓用とした。水分摂取と安静を指導し、呼吸苦の増悪、39℃以上の発熱持続、経口摂取困難があれば時間外でも再受診するよう説明した。3日後の再診では体温36.9℃、咳嗽は軽減、CRPは2.1 mg/dLまで改善しており、抗菌薬は予定通り終了、糖尿病と高血圧の定期フォローを継続する方針とした。";

      function ann(text, labelId, phrase, count) {
        let idx = -1;
        let from = 0;
        for (let i = 0; i <= count; i += 1) {
          idx = text.indexOf(phrase, from);
          from = idx + phrase.length;
        }
        return {
          id: makeId("ann"),
          labelId,
          start: idx,
          end: idx + phrase.length,
          spanText: phrase,
          comment: "",
          status: "pending",
          meta: {},
        };
      }

      function annWith(text, labelId, phrase, count, overrides) {
        return { ...ann(text, labelId, phrase, count), ...(overrides || {}) };
      }

      const followupText =
        "再診時に発熱は解熱し、咳は軽快した。CRP 2.1 mg/dLへ改善。内服は継続せず、生活指導を中心にフォローする。";

      const seedProjects = [
        {
          id: "medical-001",
          name: "医療NER: 呼吸器",
          description: "肺炎症例を中心に多ラベルアノテーションを行う。",
          meta: {},
          guideline:
            "診断確定語を優先して疾患名を付与する。検査値は項目名+数値を基本単位とし、単位ラベルと重複を許容する。",
          shortcutHelpEnabled: true,
          labels: [
            {

            },
            {

            },
            {

              name: "検査値",
              color: "#5AA35A",
              description: "数値を伴う検査項目を付与する。例: CRP 8.4 mg/dL。",
            },
            {
              id: "label-unit",
              name: "単位",
              color: "#8F6A47",
              description: "測定単位や濃度単位を付与する。例: mmHg、mg/dL。",
            },
            {
              id: "label-symptom",
              name: "症状",
              color: "#D08A3E",
              description: "主訴や身体所見を付与する。例: 乾いた咳。",
            },
            {
              id: "label-plan",
              name: "治療計画",
              color: "#7A63C8",
              description: "指導内容や今後のフォロー方針を付与する。",
            },
          ],
          documents: [
            {
              id: "doc-001",
              documentName: "初診_58歳男性_救急外来",
              text: baseText,
              status: "pending",
              createdAt: Date.now() - 1000 * 60 * 60 * 72,
              updatedAt: Date.now() - 1000 * 60 * 18,
              meta: { publish_date: "2026-02-11" },
              annotations: [
                ann(baseText, "label-disease", "市中肺炎", 0),
                ann(baseText, "label-disease", "2型糖尿病", 0),
                ann(baseText, "label-disease", "高血圧症", 0),
                ann(baseText, "label-disease", "脂質異常症", 0),
                ann(baseText, "label-drug", "レボフロキサシン500mg", 0),
                ann(baseText, "label-drug", "アセトアミノフェン500mg", 0),
                ann(baseText, "label-lab", "血圧146/88 mmHg", 0),
                ann(baseText, "label-lab", "CRP 8.4 mg/dL", 0),
                ann(baseText, "label-lab", "HbA1c 7.1%", 0),
                ann(baseText, "label-lab", "CRPは2.1 mg/dL", 0),
                ann(baseText, "label-unit", "mmHg", 0),
                ann(baseText, "label-unit", "mg/dL", 0),
                ann(baseText, "label-unit", "mg/dL", 1),
                ann(baseText, "label-plan", "CRPは2.1 mg/dL", 0),
                ann(baseText, "label-symptom", "乾いた咳", 0),
                ann(baseText, "label-symptom", "全身倦怠感", 0),
                ann(baseText, "label-plan", "再受診するよう説明した", 0),
              ],
            },
            {
              id: "doc-002",
              documentName: "再診_3日後フォロー",
              text: followupText,
              status: "verified",
              createdAt: Date.now() - 1000 * 60 * 60 * 48,
              updatedAt: Date.now() - 1000 * 60 * 60 * 12,
              meta: { publish_date: "2026-02-12" },
              annotations: [
                annWith(followupText, "label-lab", "CRP 2.1 mg/dL", 0, {
                  comment: "改善指標として重要",
                  status: "verified",
                }),
                annWith(followupText, "label-unit", "mg/dL", 0, {
                  status: "verified",
                }),
              ],
            },
            {
              id: "doc-003",
              documentName: "病棟サマリ_退院前",
              text:
                "退院前評価では呼吸状態は安定。糖尿病は内科外来で継続管理し、薬剤調整は次回受診時に再評価する。",
              status: "pending",
              createdAt: Date.now() - 1000 * 60 * 60 * 24,
              updatedAt: Date.now() - 1000 * 60 * 30,
              meta: { publish_date: "2026-02-13" },
              annotations: [],
            },
          ],
        },
        {
          id: "medical-002",
          name: "医療NER: 生活習慣病",
          description: "糖尿病と高血圧の外来文章を対象にアノテーション。",
          meta: {},
          guideline: "",
          shortcutHelpEnabled: true,
          labels: [],
          documents: [],
        },
      ];

      const state = {
        currentProjectId: null,
        selectedDocId: null,
        selectedAnnotationId: null,
        focusedLabelId: null,
        hoverLaneAnnId: null,
        sortBy: "created",
        dirty: false,
        flash: "",
        showCreateDocModal: false,
        showUnsavedDialog: false,
        showShortcutModal: false,
        pendingDocSwitchId: null,
        pendingNavigationHash: null,
        accordionOpen: {},
        underlineLaneByAnnId: {},
        globalUnderlineReserve: 0,
        undoStack: [],
        redoStack: [],
        exportIncludePending: true,
        exportIncludeVerified: true,
        projects: deepClone(seedProjects),
      };

      let keyboardShortcutsBound = false;

      const savedSnapshots = {};
      state.projects.forEach((project) => {
        savedSnapshots[project.id] = deepClone(project);
      });

      function getCurrentProject() {
        return state.projects.find((p) => p.id === state.currentProjectId) || null;
      }

      function ensureProjectConfig(project) {
        if (!project) return;
        if (typeof project.guideline !== "string") project.guideline = "";
        if (typeof project.shortcutHelpEnabled !== "boolean") project.shortcutHelpEnabled = true;
        if (!project.meta || typeof project.meta !== "object" || Array.isArray(project.meta)) project.meta = {};
      }

      function getCurrentDocument() {
        const project = getCurrentProject();
        if (!project) return null;
        return project.documents.find((d) => d.id === state.selectedDocId) || null;
      }

      function getSelectedAnnotation() {
        const doc = getCurrentDocument();
        if (!doc) return null;
        return doc.annotations.find((a) => a.id === state.selectedAnnotationId) || null;
      }

      function getFocusedLabel() {
        const project = getCurrentProject();
        if (!project) return null;
        return project.labels.find((l) => l.id === state.focusedLabelId) || null;
      }

      function getAnnotationsInPanelOrder(doc, project) {
        if (!doc || !project) return [];
        const groups = Object.fromEntries(project.labels.map((label) => [label.id, []]));
        const fallback = [];
        doc.annotations.forEach((ann) => {
          if (groups[ann.labelId]) {
            groups[ann.labelId].push(ann);
          } else {
            fallback.push(ann);
          }
        });
        const ordered = [];
        project.labels.forEach((label) => {
          ordered.push(...groups[label.id]);
        });
        ordered.push(...fallback);
        return ordered;
      }

      function showFlash(message) {
        state.flash = message;
        render();
        window.setTimeout(() => {
          if (state.flash === message) {
            state.flash = "";
            render();
          }
        }, 1600);
      }

      function touchDoc(doc) {
        doc.updatedAt = Date.now();
        doc.status = "pending";
      }

      function hasOverlap(annotations, labelId, start, end, excludeId) {
        return annotations.some((a) => {
          if (a.id === excludeId) return false;
          if (a.labelId !== labelId) return false;
          return a.start < end && a.end > start;
        });
      }

      function saveCurrentProjectSnapshot() {
        const project = getCurrentProject();
        if (!project) return;
        savedSnapshots[project.id] = deepClone(project);
      }

      function saveChanges() {
        saveCurrentProjectSnapshot();
        state.dirty = false;
        pushWorkspaceHistory();
        showFlash("保存した");
      }

      function submitCurrentDocument() {
        const project = getCurrentProject();
        const doc = getCurrentDocument();
        if (!project || !doc) return;
        const sortedDocs = getSortedDocuments(project);
        const currentIndex = sortedDocs.findIndex((item) => item.id === doc.id);

        doc.status = "verified";
        doc.updatedAt = Date.now();
        doc.annotations.forEach((item) => {
          item.status = "verified";
        });

        let nextPendingDoc = null;
        for (let i = currentIndex + 1; i < sortedDocs.length; i += 1) {
          if (sortedDocs[i].status === "pending") {
            nextPendingDoc = sortedDocs[i];
            break;
          }
        }
        if (!nextPendingDoc) {
          for (let i = 0; i < currentIndex; i += 1) {
            if (sortedDocs[i].status === "pending") {
              nextPendingDoc = sortedDocs[i];
              break;
            }
          }
        }
        if (nextPendingDoc) {
          state.selectedDocId = nextPendingDoc.id;
          state.selectedAnnotationId = nextPendingDoc.annotations[0] ? nextPendingDoc.annotations[0].id : null;
        } else {
          state.selectedAnnotationId = doc.annotations[0] ? doc.annotations[0].id : null;
        }
        state.hoverLaneAnnId = null;

        state.dirty = false;
        saveCurrentProjectSnapshot();
        pushWorkspaceHistory();
        showFlash(
          nextPendingDoc
            ? "Submit完了: verified更新後に次のpending docへ移動した"
            : "Submit完了: Document/Annotationsをverifiedに更新した"
        );
      }

      function restoreCurrentProject() {
        const snapshot = savedSnapshots[state.currentProjectId];
        if (!snapshot) return;
        const idx = state.projects.findIndex((p) => p.id === state.currentProjectId);
        if (idx >= 0) state.projects[idx] = deepClone(snapshot);
      }

      function setDirty() {
        state.dirty = true;
      }

      function createWorkspaceHistoryEntry() {
        const project = getCurrentProject();
        if (!project) return null;
        return {
          project: deepClone(project),
          selectedDocId: state.selectedDocId,
          selectedAnnotationId: state.selectedAnnotationId,
          focusedLabelId: state.focusedLabelId,
          sortBy: state.sortBy,
          accordionOpen: deepClone(state.accordionOpen),
          dirty: state.dirty,
        };
      }

      function historyEntriesEqual(a, b) {
        return JSON.stringify(a) === JSON.stringify(b);
      }

      function resetWorkspaceHistory() {
        state.undoStack = [];
        state.redoStack = [];
        const initialEntry = createWorkspaceHistoryEntry();
        if (!initialEntry) return;
        state.undoStack.push(initialEntry);
      }

      function pushWorkspaceHistory() {
        const currentEntry = createWorkspaceHistoryEntry();
        if (!currentEntry) return;
        const lastEntry = state.undoStack[state.undoStack.length - 1];
        if (lastEntry && historyEntriesEqual(lastEntry, currentEntry)) return;
        state.undoStack.push(currentEntry);
        if (state.undoStack.length > 100) {
          state.undoStack.splice(0, state.undoStack.length - 100);
        }
        state.redoStack = [];
      }

      function applyWorkspaceHistoryEntry(entry, options) {
        const preserveDocSelection = !!(options && options.preserveDocSelection);
        const currentDocId = state.selectedDocId;
        const projectIndex = state.projects.findIndex((item) => item.id === state.currentProjectId);
        if (projectIndex < 0) return false;
        state.projects[projectIndex] = deepClone(entry.project);
        state.sortBy = entry.sortBy || "created";
        state.selectedDocId = preserveDocSelection ? currentDocId || null : entry.selectedDocId || null;
        state.selectedAnnotationId = entry.selectedAnnotationId || null;
        state.focusedLabelId = entry.focusedLabelId || null;
        state.dirty = !!entry.dirty;
        state.hoverLaneAnnId = null;
        state.showCreateDocModal = false;
        state.showUnsavedDialog = false;
        state.showShortcutModal = false;
        state.pendingDocSwitchId = null;
        state.pendingNavigationHash = null;

        const project = getCurrentProject();
        if (!project) return false;
        const entryDocIdExists = !!(entry.selectedDocId && project.documents.some((doc) => doc.id === entry.selectedDocId));
        if (!project.documents.some((doc) => doc.id === state.selectedDocId)) {
          state.selectedDocId = entryDocIdExists
            ? entry.selectedDocId
            : project.documents[0]
              ? project.documents[0].id
              : null;
        }
        const doc = getCurrentDocument();
        if (!doc || !doc.annotations.some((ann) => ann.id === state.selectedAnnotationId)) {
          state.selectedAnnotationId = doc && doc.annotations[0] ? doc.annotations[0].id : null;
        }
        if (!project.labels.some((label) => label.id === state.focusedLabelId)) {
          state.focusedLabelId = project.labels[0] ? project.labels[0].id : null;
        }
        const nextAccordionOpen = {};
        project.labels.forEach((label) => {
          const savedOpen = entry.accordionOpen ? entry.accordionOpen[label.id] : undefined;
          nextAccordionOpen[label.id] = typeof savedOpen === "boolean" ? savedOpen : true;
        });
        state.accordionOpen = nextAccordionOpen;
        return true;
      }

      function undoWorkspace() {
        if (state.undoStack.length <= 1) {
          showFlash("これ以上Undoできない");
          return;
        }
        const currentEntry = state.undoStack.pop();
        if (currentEntry) state.redoStack.push(currentEntry);
        const previousEntry = state.undoStack[state.undoStack.length - 1];
        if (!previousEntry || !applyWorkspaceHistoryEntry(previousEntry, { preserveDocSelection: true })) {
          showFlash("Undoに失敗した");
          return;
        }
        showFlash("Undoした");
      }

      function redoWorkspace() {
        if (state.redoStack.length === 0) {
          showFlash("これ以上Redoできない");
          return;
        }
        const nextEntry = state.redoStack.pop();
        if (!nextEntry) {
          showFlash("Redoに失敗した");
          return;
        }
        state.undoStack.push(nextEntry);
        if (!applyWorkspaceHistoryEntry(nextEntry, { preserveDocSelection: true })) {
          showFlash("Redoに失敗した");
          return;
        }
        showFlash("Redoした");
      }

      function parseHash() {
        const hash = location.hash.replace(/^#/, "");
        if (hash === "" || hash === "/projects") return { view: "projects" };
        const settingsMatch = hash.match(/^\/projects\/([^/]+)\/settings$/);
        if (settingsMatch) return { view: "settings", projectId: decodeURIComponent(settingsMatch[1]) };
        const dataIoMatch = hash.match(/^\/projects\/([^/]+)\/data-io$/);
        if (dataIoMatch) return { view: "settings", projectId: decodeURIComponent(dataIoMatch[1]) };
        const match = hash.match(/^\/projects\/([^/]+)$/);
        if (match) return { view: "workspace", projectId: decodeURIComponent(match[1]) };
        return { view: "projects" };
      }

      function ensureWorkspaceState(projectId) {
        if (state.currentProjectId === projectId) return;
        state.currentProjectId = projectId;
        state.sortBy = "created";
        state.hoverLaneAnnId = null;
        state.dirty = false;
        state.showCreateDocModal = false;
        state.showUnsavedDialog = false;
        state.showShortcutModal = false;
        state.pendingDocSwitchId = null;
        state.pendingNavigationHash = null;
        state.exportIncludePending = true;
        state.exportIncludeVerified = true;
        state.accordionOpen = {};
        const project = getCurrentProject();
        if (!project) return;
        ensureProjectConfig(project);
        state.selectedDocId = project.documents[0] ? project.documents[0].id : null;
        state.focusedLabelId = project.labels[0] ? project.labels[0].id : null;
        const doc = getCurrentDocument();
        state.selectedAnnotationId = doc && doc.annotations[0] ? doc.annotations[0].id : null;
        project.labels.forEach((label) => {
          state.accordionOpen[label.id] = true;
        });
        resetWorkspaceHistory();
      }

      function getSortedDocuments(project) {
        const docs = [...project.documents];
        if (state.sortBy === "created") docs.sort((a, b) => a.createdAt - b.createdAt);
        if (state.sortBy === "pendingFirst")
          docs.sort((a, b) => {
            if (a.status !== b.status) return a.status === "pending" ? -1 : 1;
            return a.createdAt - b.createdAt;
          });
        if (state.sortBy === "updated") docs.sort((a, b) => b.updatedAt - a.updatedAt);
        if (state.sortBy === "name")
          docs.sort((a, b) => a.documentName.localeCompare(b.documentName, "ja"));
        return docs;
      }

      function buildSegments(text, annotations) {
        const points = new Set([0, text.length]);
        annotations.forEach((item) => {
          points.add(item.start);
          points.add(item.end);
        });
        const sorted = [...points].sort((a, b) => a - b);
        const segments = [];
        for (let i = 0; i < sorted.length - 1; i += 1) {
          const start = sorted[i];
          const end = sorted[i + 1];
          if (start === end) continue;
          const covers = annotations.filter((item) => item.start < end && item.end > start);
          segments.push({ start, end, text: text.slice(start, end), covers });
        }
        return segments;
      }

      function renderDocText(doc, project) {
        if (!doc) {
          state.underlineLaneByAnnId = {};
          state.globalUnderlineReserve = 0;
          return '<p class="small">Documentを選択すると本文が表示される。</p>';
        }
        const labelById = Object.fromEntries(project.labels.map((label) => [label.id, label]));
        const labelOrderById = Object.fromEntries(project.labels.map((label, index) => [label.id, index]));
        const selectedAnnotation = doc.annotations.find((item) => item.id === state.selectedAnnotationId) || null;
        const underlineLaneByAnnId = {};
        let maxUnderlineLane = -1;
        const laneEnds = [];
        doc.annotations
          .filter((item) => item.labelId !== state.focusedLabelId)
          .sort((a, b) => {
            if (a.start !== b.start) return a.start - b.start;
            if (a.end !== b.end) return a.end - b.end;
            const labelDiff = (labelOrderById[a.labelId] || 0) - (labelOrderById[b.labelId] || 0);
            if (labelDiff !== 0) return labelDiff;
            return a.id.localeCompare(b.id);
          })
          .forEach((item) => {
            let laneIndex = 0;
            while (laneIndex < laneEnds.length && laneEnds[laneIndex] > item.start) {
              laneIndex += 1;
            }
            laneEnds[laneIndex] = item.end;
            underlineLaneByAnnId[item.id] = laneIndex;
            if (laneIndex > maxUnderlineLane) maxUnderlineLane = laneIndex;
          });
        const globalReserveBottom =
          maxUnderlineLane >= 0
            ? UNDERLINE_LANE_BASE + maxUnderlineLane * UNDERLINE_LANE_PITCH + UNDERLINE_PADDING_TAIL
            : 0;
        state.underlineLaneByAnnId = underlineLaneByAnnId;
        state.globalUnderlineReserve = globalReserveBottom;
        const segments = buildSegments(doc.text, doc.annotations);
        return segments
          .map((segment) => {
            const raw = escapeHtml(segment.text);
            if (segment.covers.length === 0) return raw;
            const focused = segment.covers.find((item) => item.labelId === state.focusedLabelId) || null;
            const primary = focused || segment.covers[0];
            const markerColor = focused ? (labelById[focused.labelId] || {}).color || "#999999" : "";
            const underlineItems = segment.covers
              .filter((item) => !focused || item.id !== focused.id)
              .sort((a, b) => {
                const laneDiff = (underlineLaneByAnnId[a.id] || 0) - (underlineLaneByAnnId[b.id] || 0);
                if (laneDiff !== 0) return laneDiff;
                if (a.start !== b.start) return a.start - b.start;
                return a.id.localeCompare(b.id);
              });
            const styleParts = [];
            if (markerColor) {
              styleParts.push("background-color:" + hexToRgba(markerColor, 0.34));
            }
            const isSelected = selectedAnnotation
              ? segment.covers.some((item) => item.id === selectedAnnotation.id)
              : false;
            const selectedClass = isSelected ? " selected" : "";
            const selectedStartClass = isSelected && selectedAnnotation && segment.start === selectedAnnotation.start ? " start" : "";
            const selectedEndClass = isSelected && selectedAnnotation && segment.end === selectedAnnotation.end ? " end" : "";
            const markerClass = markerColor ? " has-marker" : "";
            const underlineClass = underlineItems.length > 0 ? " has-underline" : "";
            const underlineAnnIds = underlineItems.map((item) => item.id);
            const coverAnnIds = segment.covers.map((item) => item.id);
            const title = segment.covers
              .map((item) => (labelById[item.labelId] ? labelById[item.labelId].name : "Unknown"))
              .join(", ");
            return (
              '<span class="annotation-segment' +
              selectedClass +
              selectedStartClass +
              selectedEndClass +
              markerClass +
              underlineClass +
              '" data-primary-ann-id="' +
              primary.id +
              '" data-under-ann-ids="' +
              underlineAnnIds.join(",") +
              '" data-cover-ann-ids="' +
              coverAnnIds.join(",") +
              '" style="' +
              styleParts.join(";") +
              '" title="' +
              escapeHtml(title) +
              '">' +
              raw +
              "</span>"
            );
          })
          .join("");
      }

      function contextParts(text, start, end, size) {
        const left = text.slice(Math.max(0, start - size), start);
        const mid = text.slice(start, end);
        const right = text.slice(end, Math.min(text.length, end + size));
        return { left, mid, right };
      }

      function renderProjects() {
        const cards = state.projects
          .map((project) => {
            return `
              <article class="project-card">
                <div class="project-title">${escapeHtml(project.name)}</div>
                <p class="project-desc">${escapeHtml(project.description || "")}</p>
                <div class="project-meta">
                  <span>${project.documents.length} Docs</span>
                  <span>${project.labels.length} Labels</span>
                </div>
                <button class="btn btn-primary" data-open-project="${project.id}">Open Workspace</button>
              </article>
            `;
          })
          .join("");

        return `
          <header class="topbar">
            <div>
              <div class="brand">Layered Span Studio Mock</div>
              <div class="small">Project一覧から新規ImportまたはWorkspaceへ遷移するモック</div>
            </div>
            <span class="small">API接続なし / 1ファイル構成</span>
          </header>
          <main class="projects-wrap">
            <h2>Projects</h2>
            <section class="card field" style="max-width:720px;margin-bottom:18px;">
              <h4>Import Project</h4>
              <div class="small">backend の <code>POST /projects/import</code> 相当。Export JSON から新しい project を作成する。</div>
              <div class="small">同名 project がある場合は <code>(imported)</code>, <code>(imported 2)</code> ... を付けて自動改名する。</div>
              <label for="project-import-json-file">Import JSONファイル</label>
              <input id="project-import-json-file" type="file" accept=".json,application/json" />
              <div style="display:flex;justify-content:flex-end;">
                <button class="btn btn-primary" id="run-project-import-btn">新規ProjectとしてImport</button>
              </div>
            </section>
            <div class="project-grid">${cards}</div>
          </main>
        `;
      }

      function renderProjectHeader(project, currentView) {
        const workspaceHash = "#/projects/" + project.id;
        const settingsHash = "#/projects/" + project.id + "/settings";
        return `
          <header class="topbar">
            <div>
              <button class="btn" data-nav-hash="#/projects">← Projectsへ戻る</button>
              <span style="margin-left:10px;font-weight:700;">${escapeHtml(project.name)}</span>
              ${state.dirty ? '<span class="pill pending" style="margin-left:8px;">未保存</span>' : ""}
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <button class="btn ${currentView === "workspace" ? "btn-primary" : ""}" data-nav-hash="${workspaceHash}">Workspace</button>
              <button class="btn ${currentView === "settings" ? "btn-primary" : ""}" data-nav-hash="${settingsHash}">Project Settings</button>
            </div>
          </header>
        `;
      }

      function renderWorkspace(project) {
        const docs = getSortedDocuments(project);
        const doc = getCurrentDocument();
        const selectedAnn = getSelectedAnnotation();
        const focusedLabel = getFocusedLabel();
        const pendingDocsCount = project.documents.filter((item) => item.status === "pending").length;

        const docsHtml = docs
          .map((item) => {
            return `
              <button class="doc-item ${item.id === state.selectedDocId ? "active" : ""}" data-doc-id="${item.id}">
                <div>
                  <div class="doc-name">${escapeHtml(item.documentName)}</div>
                  <div class="doc-sub">更新: ${formatDate(item.updatedAt)}</div>
                </div>
                <span class="pill ${item.status}">${item.status}</span>
              </button>
            `;
          })
          .join("");

        const labelsHtml = project.labels
          .map((label) => {
            const isActive = label.id === state.focusedLabelId;
            return `
              <button
                class="label-btn ${isActive ? "active" : ""}"
                data-label-id="${label.id}"
                style="${getLabelButtonStyle(label, isActive)}"
              >
                ${escapeHtml(label.name)}
              </button>
            `;
          })
          .join("");

        const annotationGroups = project.labels
          .map((label) => {
            const list = doc ? doc.annotations.filter((a) => a.labelId === label.id) : [];
            const open = state.accordionOpen[label.id] !== false;
            const listHtml = open
              ? `
              <div class="anno-list">
                ${
                  list.length === 0
                      ? '<div class="small">該当アノテーションなし</div>'
                    : list
                        .map((item) => {
                          const context = contextParts(doc.text, item.start, item.end, 10);
                          return `
                            <button
                              class="anno-item ${item.id === state.selectedAnnotationId ? "active" : ""}"
                              data-ann-id="${item.id}"
                              style="${getAnnoItemStyle(label)}"
                            >
                              <span class="anno-context">
                                <span class="anno-context-muted">${escapeHtml(context.left)}</span><span class="anno-context-focus">${escapeHtml(context.mid)}</span><span class="anno-context-muted">${escapeHtml(context.right)}</span>
                              </span>
                              <span class="pill ${item.status}">${item.status}</span>
                            </button>
                          `;
                        })
                        .join("")
                }
              </div>
            `
              : "";
            return `
              <section class="anno-group" style="${getGroupStyle(label)}">
                <button class="anno-group-head" data-accordion-id="${label.id}">
                  <span style="display:flex;align-items:center;gap:7px;">
                    <span style="width:10px;height:10px;border-radius:999px;background:${escapeHtml(label.color || "#8b94a0")};display:inline-block;"></span>
                    <span>${escapeHtml(label.name)} (${list.length})</span>
                  </span>
                  <span>${open ? "▼" : "▶"}</span>
                </button>
                ${listHtml}
              </section>
            `;
          })
          .join("");

        const docTextHtml = renderDocText(doc, project);
        const docTextBottomPadding = state.globalUnderlineReserve > 0 ? state.globalUnderlineReserve + 2 : 0;
        const metaText = selectedAnn ? JSON.stringify(selectedAnn.meta || {}, null, 2) : "";

        return `
          ${renderProjectHeader(project, "workspace")}
          <main class="workspace-wrap">
            <section class="panel">
              <div class="panel-head">
                <span class="small">${pendingDocsCount} pending / ${project.documents.length} docs</span>
                <div style="display:flex;gap:8px;align-items:center;">
                  <select id="doc-sort" class="btn">
                    <option value="created" ${state.sortBy === "created" ? "selected" : ""}>作成順</option>
                    <option value="pendingFirst" ${state.sortBy === "pendingFirst" ? "selected" : ""}>未完了優先</option>
                    <option value="updated" ${state.sortBy === "updated" ? "selected" : ""}>最終更新順</option>
                    <option value="name" ${state.sortBy === "name" ? "selected" : ""}>document_name順</option>
                  </select>
                  <button class="btn" id="create-doc-open">+ Doc</button>
                </div>
              </div>
              <div class="doc-list">${docsHtml}</div>
            </section>

            <section class="panel center-panel">
              <div class="label-strip">${labelsHtml}</div>
              <div class="canvas-wrap">
                <div class="canvas-help">ドラッグ選択すると、選択中Labelに即時でAnnotationを作成する。</div>
                <div class="doc-stage" id="doc-stage">
                  <div id="doc-text" class="doc-text" style="padding-bottom:${docTextBottomPadding}px;">${docTextHtml}</div>
                  <div id="doc-overlay" class="doc-overlay" aria-hidden="true"></div>
                </div>
              </div>
              <div class="center-actions">
                <button class="btn" id="save-btn">Save</button>
                <button class="btn btn-primary" id="submit-btn">Submit</button>
              </div>
            </section>

            <aside class="right-panel">
              <section class="card">
                <h4>アノテーション基準</h4>

      function renderOverlay() {
        const overlays = [];
        const unsavedMessage = state.pendingNavigationHash
          ? "Project一覧へ戻る前に処理を選択する。"
          : "Documentを切り替える前に処理を選択する。";
        if (state.showCreateDocModal) {
          overlays.push(`
            <div class="overlay">
              <div class="modal">
                <h3>Create Document</h3>
                <div class="field">
                  <label for="new-doc-name">document_name</label>

                </div>
                <div class="field" style="margin-top:8px;">
                  <label for="new-doc-text">text</label>
                  <textarea id="new-doc-text" placeholder="アノテーション対象の本文"></textarea>
                </div>
                <div class="actions">

                  <button class="btn btn-primary" id="create-doc-submit">作成</button>

          `);
        }
        if (state.showUnsavedDialog) {
          overlays.push(`
            <div class="overlay">
              <div class="modal">
                <h3>未保存の変更がある</h3>
                <p class="small">${unsavedMessage}</p>
                <div class="actions">
                  <button class="btn" data-unsaved-action="cancel">キャンセル</button>
                  <button class="btn btn-danger" data-unsaved-action="discard">破棄して移動</button>
                  <button class="btn btn-primary" data-unsaved-action="save">保存して移動</button>
                </div>
              </div>
            </div>
          `);
        }
        if (state.showShortcutModal) {
          overlays.push(`
            <div class="overlay">
              <div class="modal">

                <ul class="shortcut-list">
                  <li class="shortcut-item"><span class="shortcut-keys">Cmd+S</span><span>Save</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Cmd+Enter</span><span>Submit（doc + annotations を verified、次pendingへ）</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Cmd+Z</span><span>Undo</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Cmd+Y / Cmd+Shift+Z</span><span>Redo</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">J / K</span><span>次のDoc / 前のDoc</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Shift+J / Shift+K</span><span>次のpending Doc / 前のpending Doc</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">[ / ] / ← / →</span><span>前Label / 次Label</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">N / P / ↓ / ↑</span><span>現在Label内で次 / 前を選択（未選択時は先頭 / 末尾）</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Esc</span><span>選択中Annotationを解除</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Delete / Backspace</span><span>選択中Annotationを削除</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">?</span><span>この一覧を開く / 閉じる</span></li>
                </ul>
                <div class="actions">
                  <button class="btn btn-primary" id="shortcut-close">閉じる</button>
                </div>
              </div>

        if (state.flash) overlays.push(`<div class="flash">${escapeHtml(state.flash)}</div>`);
        return overlays.join("");
      }

      function render() {
        const route = parseHash();
        const app = document.getElementById("app");
        if (!app) return;
        bindKeyboardShortcuts();
        const laneTooltip = document.getElementById("lane-hover-tooltip");
        if (laneTooltip) {
          laneTooltip.classList.remove("show");
          laneTooltip.setAttribute("aria-hidden", "true");
        }
        if (route.view === "projects") {
          state.currentProjectId = null;
          state.hoverLaneAnnId = null;
          app.innerHTML = renderProjects() + renderOverlay();
          bindCommonEvents();
          return;
        }
        ensureWorkspaceState(route.projectId);
        const project = getCurrentProject();
        if (!project) {
          location.hash = "#/projects";
          return;
        }
        if (route.view === "workspace") {
          app.innerHTML = renderWorkspace(project) + renderOverlay();
        } else if (route.view === "settings") {
          app.innerHTML = renderSettings(project) + renderOverlay();
        } else {
          location.hash = "#/projects/" + encodeURIComponent(project.id);
          return;
        }
        bindCommonEvents();
      }

      function requestDocSwitch(nextDocId) {
        if (nextDocId === state.selectedDocId) return;
        if (state.dirty) {
          state.pendingDocSwitchId = nextDocId;
          state.pendingNavigationHash = null;
          state.showUnsavedDialog = true;
          render();
          return;
        }
        applyDocSwitch(nextDocId);
      }

      function applyDocSwitch(nextDocId) {
        state.selectedDocId = nextDocId;
        state.hoverLaneAnnId = null;
        state.showUnsavedDialog = false;
        state.pendingDocSwitchId = null;
        state.pendingNavigationHash = null;
        const doc = getCurrentDocument();
        state.selectedAnnotationId = doc && doc.annotations[0] ? doc.annotations[0].id : null;
        render();
      }

      function requestNavigation(nextHash) {
        if (!nextHash || location.hash === nextHash) return;
        if (nextHash === "#/projects" && state.dirty) {
          state.pendingDocSwitchId = null;
          state.pendingNavigationHash = nextHash;
          state.showUnsavedDialog = true;
          render();
          return;
        }
        location.hash = nextHash;
      }

      function moveDocumentByDirection(direction, pendingOnly) {
        const project = getCurrentProject();
        const currentDoc = getCurrentDocument();
        if (!project || !currentDoc) return;
        const sortedDocs = getSortedDocuments(project);
        const currentIndex = sortedDocs.findIndex((item) => item.id === currentDoc.id);
        if (currentIndex < 0) return;
        let idx = currentIndex + direction;
        while (idx >= 0 && idx < sortedDocs.length) {
          const candidate = sortedDocs[idx];
          if (!pendingOnly || candidate.status === "pending") {
            requestDocSwitch(candidate.id);
            return;
          }
          idx += direction;
        }
        showFlash(pendingOnly ? "移動先のpending docがない" : "移動先のdocがない");
      }

      function moveLabelByDirection(direction) {
        const project = getCurrentProject();
        if (!project || project.labels.length === 0) return;
        const currentIndex = project.labels.findIndex((label) => label.id === state.focusedLabelId);
        const base = currentIndex >= 0 ? currentIndex : 0;
        const nextIndex = base + direction;
        if (nextIndex < 0 || nextIndex >= project.labels.length) return;
        state.focusedLabelId = project.labels[nextIndex].id;
        state.selectedAnnotationId = null;
        state.hoverLaneAnnId = null;
        render();
      }

      function moveAnnotationByDirection(direction) {
        const project = getCurrentProject();
        const doc = getCurrentDocument();
        if (!project || !doc || doc.annotations.length === 0) return;
        const focusedLabelId = state.focusedLabelId;
        const ordered = getAnnotationsInPanelOrder(doc, project).filter((item) => item.labelId === focusedLabelId);
        if (ordered.length === 0) {
          showFlash("現在LabelにAnnotationがない");
          return;
        }
        const current = doc.annotations.find((item) => item.id === state.selectedAnnotationId) || null;
        const hasSameLabelSelection = !!(current && current.labelId === focusedLabelId);
        const currentIndex = hasSameLabelSelection ? ordered.findIndex((item) => item.id === current.id) : -1;
        let nextIndex = currentIndex + direction;
        if (currentIndex < 0) {
          nextIndex = direction > 0 ? 0 : ordered.length - 1;
        }
        if (nextIndex < 0 || nextIndex >= ordered.length) return;
        const next = ordered[nextIndex];
        if (!next) return;
        state.selectedAnnotationId = next.id;
        state.focusedLabelId = next.labelId;
        render();
      }

      function deleteSelectedAnnotation() {
        const project = getCurrentProject();
        const doc = getCurrentDocument();
        if (!project || !doc || !state.selectedAnnotationId) return;
        const deleteTargetId = state.selectedAnnotationId;
        const listBefore = getAnnotationsInPanelOrder(doc, project);
        const selectedOrderIndex = listBefore.findIndex((item) => item.id === deleteTargetId);
        const removeIndex = doc.annotations.findIndex((item) => item.id === deleteTargetId);
        if (removeIndex < 0) return;
        doc.annotations.splice(removeIndex, 1);
        touchDoc(doc);
        setDirty();
        const listAfter = listBefore.filter((item) => item.id !== deleteTargetId);
        if (listAfter.length === 0) {
          state.selectedAnnotationId = null;
        } else {
          const nextIndex = Math.min(Math.max(selectedOrderIndex, 0), listAfter.length - 1);
          const next = listAfter[nextIndex];
          state.selectedAnnotationId = next.id;
          state.focusedLabelId = next.labelId;
        }
        state.hoverLaneAnnId = null;
        pushWorkspaceHistory();
        showFlash("選択中Annotationを削除した");
      }

      function normalizeWorkspaceSelection(project) {
        if (!project) return;
        ensureProjectConfig(project);
        if (!project.documents.some((item) => item.id === state.selectedDocId)) {
          state.selectedDocId = project.documents[0] ? project.documents[0].id : null;
        }
        if (!project.labels.some((item) => item.id === state.focusedLabelId)) {
          state.focusedLabelId = project.labels[0] ? project.labels[0].id : null;
        }
        const doc = getCurrentDocument();
        if (!doc || !doc.annotations.some((item) => item.id === state.selectedAnnotationId)) {
          state.selectedAnnotationId = doc && doc.annotations[0] ? doc.annotations[0].id : null;
        }
        const nextAccordionOpen = {};
        project.labels.forEach((label) => {
          const savedOpen = state.accordionOpen[label.id];
          nextAccordionOpen[label.id] = typeof savedOpen === "boolean" ? savedOpen : true;
        });
        state.accordionOpen = nextAccordionOpen;
        state.hoverLaneAnnId = null;
      }

      function normalizeMeta(value) {
        if (!value || typeof value !== "object" || Array.isArray(value)) return {};
        return deepClone(value);
      }

      function hasRangeOverlap(ranges, start, end) {
        return ranges.some(([existingStart, existingEnd]) => existingStart < end && existingEnd > start);
      }

      function buildProjectExportPayload(project, includePending, includeVerified) {
        const allowedStatuses = new Set();
        if (includePending) allowedStatuses.add("pending");
        if (includeVerified) allowedStatuses.add("verified");
        const labelById = Object.fromEntries(project.labels.map((label) => [label.id, label]));
        const projectMeta = normalizeMeta(project.meta);
        projectMeta.guideline = project.guideline || "";
        projectMeta.shortcut_help_enabled = project.shortcutHelpEnabled !== false;

        const labels = project.labels.map((label) => ({
          id: label.id,
          project_id: project.id,
          project_name: project.name,
          name: label.name,
          color: label.color,
          description: label.description || "",
          shortcut: label.shortcut || null,
          meta: normalizeMeta(label.meta),
        }));

        const documents = project.documents.map((doc) => ({
          id: doc.id,
          project_id: project.id,
          project_name: project.name,
          document_name: doc.documentName,
          text: doc.text,
          annotations: doc.annotations
            .filter((ann) => allowedStatuses.size === 0 || allowedStatuses.has(ann.status))
            .map((ann) => {
              const label = labelById[ann.labelId];
              return {
                id: ann.id,
                document_id: doc.id,
                document_name: doc.documentName,
                label_id: ann.labelId,
                label_name: label ? label.name : "",
                start: ann.start,
                end: ann.end,
                span_text: ann.spanText,
                comment: ann.comment || "",
                status: ann.status || "pending",
                meta: normalizeMeta(ann.meta),
              };
            }),
          meta: normalizeMeta(doc.meta),
        }));

        return {
          project: {
            id: project.id,
            name: project.name,
            description: project.description || "",
            meta: projectMeta,
          },
          labels,
          documents,
          meta: { format: EXPORT_FORMAT, version: EXPORT_VERSION },
        };
      }

      function validateImportPayload(project, payload) {
        if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
          throw new Error("Invalid import payload");
        }
        const incomingProject = payload.project && typeof payload.project === "object" ? payload.project : {};
        const incomingLabels = Array.isArray(payload.labels) ? payload.labels : [];
        const incomingDocuments = Array.isArray(payload.documents) ? payload.documents : [];
        const incomingMeta =
          payload.meta && typeof payload.meta === "object" && !Array.isArray(payload.meta) ? payload.meta : {};

        if (incomingMeta.format && incomingMeta.format !== EXPORT_FORMAT) {
          throw new Error("Invalid import format");
        }
        if (incomingMeta.version && incomingMeta.version !== EXPORT_VERSION) {
          throw new Error("Unsupported import version");
        }

        const existingLabels =
          project && Array.isArray(project.labels) ? project.labels : [];
        const existingDocuments =
          project && Array.isArray(project.documents) ? project.documents : [];
        const existingLabelByName = Object.fromEntries(existingLabels.map((label) => [label.name, label]));
        const incomingLabelNames = incomingLabels.map((label) => String((label && label.name) || ""));
        if (incomingLabelNames.some((name) => !name)) {
          throw new Error("Label name is required");
        }
        if (new Set(incomingLabelNames).size !== incomingLabelNames.length) {
          throw new Error("Duplicate label names in import payload");
        }
        if (incomingLabelNames.some((name) => !!existingLabelByName[name])) {
          throw new Error("Label name already exists in this project");
        }

        const existingDocumentNames = new Set(existingDocuments.map((doc) => doc.documentName));
        const incomingDocumentNames = incomingDocuments.map((doc) => String((doc && doc.document_name) || ""));
        if (incomingDocumentNames.some((name) => !name)) {
          throw new Error("Document name is required");
        }
        if (new Set(incomingDocumentNames).size !== incomingDocumentNames.length) {
          throw new Error("Duplicate document names in import payload");
        }
        if (incomingDocumentNames.some((name) => existingDocumentNames.has(name))) {
          throw new Error("Document name already exists in this project");
        }

        const labelNamesSet = new Set([...Object.keys(existingLabelByName), ...incomingLabelNames]);
        incomingDocuments.forEach((doc) => {
          const text = typeof doc.text === "string" ? doc.text : "";
          const rangesByLabelName = {};
          const annotations = Array.isArray(doc.annotations) ? doc.annotations : [];
          annotations.forEach((ann) => {
            const labelName = ann ? ann.label_name : null;
            if (!labelNamesSet.has(labelName)) {
              throw new Error("Annotation refers to unknown label_name");
            }
            if (!ann || ann.start == null || ann.end == null || ann.span_text == null) {
              throw new Error("Annotation span is incomplete");
            }
            const start = Number(ann.start);
            const end = Number(ann.end);
            if (
              !Number.isInteger(start) ||
              !Number.isInteger(end) ||
              start < 0 ||
              end < start ||
              end > text.length
            ) {
              throw new Error("Annotation span is incomplete");
            }
            if (text.slice(start, end) !== ann.span_text) {
              throw new Error("span_text does not match the specified range");
            }
            if (ann.status !== "pending" && ann.status !== "verified") {
              throw new Error("Invalid annotation status");
            }
            const labelRanges = rangesByLabelName[labelName] || [];
            if (hasRangeOverlap(labelRanges, start, end)) {
              throw new Error("Overlapping annotation span for the same label is not allowed");
            }
            labelRanges.push([start, end]);
            rangesByLabelName[labelName] = labelRanges;
          });
        });

        return {
          incomingProject,
          incomingLabels,
          incomingDocuments,
        };
      }

      function appendImportedEntities(project, incomingLabels, incomingDocuments) {
        const labelIdByName = Object.fromEntries(project.labels.map((label) => [label.name, label.id]));
        incomingLabels.forEach((label) => {
          const created = {
            id: makeId("label"),
            name: label.name,
            color: label.color || "#8b94a0",
            description: label.description || "",
            shortcut: label.shortcut || null,
            meta: normalizeMeta(label.meta),
          };
          project.labels.push(created);
          labelIdByName[created.name] = created.id;
        });

        const now = Date.now();
        let importedAnnotations = 0;
        incomingDocuments.forEach((doc, docIndex) => {
          const createdDoc = {
            id: makeId("doc"),
            documentName: doc.document_name,
            text: typeof doc.text === "string" ? doc.text : "",
            status: "pending",
            createdAt: now + docIndex,
            updatedAt: now + docIndex,
            meta: normalizeMeta(doc.meta),
            annotations: [],
          };
          const annotations = Array.isArray(doc.annotations) ? doc.annotations : [];
          annotations.forEach((ann) => {
            const labelId = labelIdByName[ann.label_name];
            if (!labelId) return;
            createdDoc.annotations.push({
              id: makeId("ann"),
              labelId,
              start: ann.start,
              end: ann.end,
              spanText: ann.span_text,
              comment: ann.comment || "",
              status: ann.status,
              meta: normalizeMeta(ann.meta),
            });
            importedAnnotations += 1;
          });
          project.documents.push(createdDoc);
        });

        return {
          labels: incomingLabels.length,
          documents: incomingDocuments.length,
          annotations: importedAnnotations,
        };
      }

      function importProjectPayload(project, payload) {
        const { incomingLabels, incomingDocuments } = validateImportPayload(project, payload);
        return appendImportedEntities(project, incomingLabels, incomingDocuments);
      }

      function resolveImportedProjectName(baseName) {
        const normalized = String(baseName || "").trim();
        if (!normalized) {
          throw new Error("Project name is required");
        }
        const existingNames = new Set(state.projects.map((project) => project.name));
        if (!existingNames.has(normalized)) return normalized;
        let candidate = normalized + " (imported)";
        let suffix = 2;
        while (existingNames.has(candidate)) {
          candidate = normalized + " (imported " + suffix + ")";
          suffix += 1;
        }
        return candidate;
      }

      function createProjectFromImportPayload(payload) {
        const { incomingProject, incomingLabels, incomingDocuments } = validateImportPayload(null, payload);
        const importedMeta = normalizeMeta(incomingProject.meta);
        const project = {
          id: makeId("project"),
          name: resolveImportedProjectName(incomingProject.name),
          description: incomingProject.description != null ? String(incomingProject.description) : "",
          meta: importedMeta,
          guideline: typeof importedMeta.guideline === "string" ? importedMeta.guideline : "",
          shortcutHelpEnabled:
            typeof importedMeta.shortcut_help_enabled === "boolean" ? importedMeta.shortcut_help_enabled : true,
          labels: [],
          documents: [],
        };
        const counts = appendImportedEntities(project, incomingLabels, incomingDocuments);
        ensureProjectConfig(project);
        return { project, counts };
      }

      function buildExportFilename(projectName) {
        const rawName = String(projectName || "project").trim();
        const safeName = rawName.replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_").slice(0, 80) || "project";
        const d = new Date();
        const datePart =
          String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
        return safeName + "-export-" + datePart + ".json";
      }

      function downloadJsonFile(filename, payload) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      async function readJsonFile(file) {
        const text = await file.text();
        try {
          return JSON.parse(text);
        } catch (_err) {
          throw new Error("JSONのパースに失敗した");
        }
      }

      function isEditingElement(target) {
        if (!target || !(target instanceof HTMLElement)) return false;
        const tag = target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
        return target.isContentEditable;
      }

      function isShortcutHelpKey(event) {
        return event.key === "?" || (event.key === "/" && event.shiftKey);
      }

      function bindKeyboardShortcuts() {
        if (keyboardShortcutsBound) return;
        keyboardShortcutsBound = true;
        window.addEventListener("keydown", (event) => {
          const route = parseHash();
          if (route.view === "projects") return;
          const isWorkspaceView = route.view === "workspace";
          const project = getCurrentProject();
          const shortcutHelpEnabled = !project || project.shortcutHelpEnabled !== false;

          if (state.showShortcutModal) {
            if (event.key === "Escape" || isShortcutHelpKey(event)) {
              event.preventDefault();
              state.showShortcutModal = false;
              render();
            }
            return;
          }

          if (isShortcutHelpKey(event) && shortcutHelpEnabled) {
            event.preventDefault();
            state.showShortcutModal = true;
            render();
            return;
          }

          if (state.showCreateDocModal || state.showUnsavedDialog) return;
          if (isEditingElement(document.activeElement)) return;

          const hasPrimaryModifier = event.metaKey || event.ctrlKey;
          const keyLower = String(event.key || "").toLowerCase();
          if (hasPrimaryModifier && keyLower === "z") {
            event.preventDefault();
            if (event.shiftKey) {
              redoWorkspace();
            } else {
              undoWorkspace();
            }
            return;
          }
          if (hasPrimaryModifier && keyLower === "y") {
            event.preventDefault();
            redoWorkspace();
            return;
          }
          if (hasPrimaryModifier && keyLower === "s") {
            event.preventDefault();
            saveChanges();
            return;
          }
          if (hasPrimaryModifier && event.key === "Enter") {
            event.preventDefault();
            submitCurrentDocument();
            return;
          }

          if (event.metaKey || event.ctrlKey || event.altKey) return;
          if (!isWorkspaceView) return;

          if (event.key === "Escape") {
            if (state.selectedAnnotationId !== null) {
              event.preventDefault();
              state.selectedAnnotationId = null;
              render();
            }
            return;
          }
          if (event.key === "Delete" || event.key === "Backspace") {
            if (state.selectedAnnotationId !== null) {
              event.preventDefault();
              deleteSelectedAnnotation();
            }
            return;
          }
          if (keyLower === "j") {
            event.preventDefault();
            moveDocumentByDirection(1, event.shiftKey);
            return;
          }
          if (keyLower === "k") {
            event.preventDefault();
            moveDocumentByDirection(-1, event.shiftKey);
            return;
          }
          if (event.key === "[" || event.key === "ArrowLeft") {
            event.preventDefault();
            moveLabelByDirection(-1);
            return;
          }
          if (event.key === "]" || event.key === "ArrowRight") {
            event.preventDefault();
            moveLabelByDirection(1);
            return;
          }
          if (keyLower === "n" || event.key === "ArrowDown") {
            event.preventDefault();
            moveAnnotationByDirection(1);
            return;
          }
          if (keyLower === "p" || event.key === "ArrowUp") {
            event.preventDefault();
            moveAnnotationByDirection(-1);
          }
        });
      }

      function getTextOffset(container, node, offset) {
        const range = document.createRange();
        range.setStart(container, 0);
        range.setEnd(node, offset);
        return range.toString().length;
      }

      function mergeInlineRects(rects) {
        const sorted = [...rects]
          .filter((rect) => rect.width > 0 && rect.height > 0)
          .sort((a, b) => (a.top !== b.top ? a.top - b.top : a.left - b.left));
        const merged = [];
        sorted.forEach((rect) => {
          const last = merged[merged.length - 1];
          const isSameLine =
            last &&
            Math.abs(last.top - rect.top) <= 1 &&
            Math.abs(last.bottom - rect.bottom) <= 1 &&
            rect.left <= last.right + 2;
          if (isSameLine) {
            last.right = Math.max(last.right, rect.right);
            return;
          }
          merged.push({
            left: rect.left,
            right: rect.right,
            top: rect.top,
            bottom: rect.bottom,
          });
        });
        return merged;
      }

      function renderDocOverlay(docText) {
        const overlay = document.getElementById("doc-overlay");
        const doc = getCurrentDocument();
        const project = getCurrentProject();
        if (!overlay || !docText || !doc || !project) {
          if (overlay) overlay.innerHTML = "";
          return;
        }

        const baseRect = docText.getBoundingClientRect();
        const rectsByAnnId = {};
        docText.querySelectorAll("[data-cover-ann-ids]").forEach((segment) => {
          const coverIds = parseCsvIds(segment.getAttribute("data-cover-ann-ids"));
          if (coverIds.length === 0) return;
          const rects = Array.from(segment.getClientRects()).map((rect) => ({
            left: rect.left - baseRect.left,
            right: rect.right - baseRect.left,
            top: rect.top - baseRect.top,
            bottom: rect.bottom - baseRect.top,
            width: rect.width,
            height: rect.height,
          }));
          coverIds.forEach((annId) => {
            if (!rectsByAnnId[annId]) rectsByAnnId[annId] = [];
            rectsByAnnId[annId].push(...rects);
          });
        });

        const annById = Object.fromEntries(doc.annotations.map((ann) => [ann.id, ann]));
        const labelById = Object.fromEntries(project.labels.map((label) => [label.id, label]));
        const laneByAnnId = state.underlineLaneByAnnId || {};
        const hitHeight = UNDERLINE_HIT_HALF * 2;

        const underlineHtml = Object.keys(laneByAnnId)
          .map((annId) => {
            const ann = annById[annId];
            if (!ann) return "";
            const label = labelById[ann.labelId];
            if (!label) return "";
            const mergedRects = mergeInlineRects(rectsByAnnId[annId] || []);
            if (mergedRects.length === 0) return "";
            const laneIndex = laneByAnnId[annId] || 0;
            const distanceFromText = UNDERLINE_LANE_BASE + laneIndex * UNDERLINE_LANE_PITCH;
            const topOffset = distanceFromText - hitHeight / 2;
            const isHover = state.hoverLaneAnnId === annId;
            const isSelectedLane = state.selectedAnnotationId === annId;
            const alpha = isHover || isSelectedLane ? 1 : state.hoverLaneAnnId ? UNDERLINE_DIM_ALPHA : UNDERLINE_IDLE_ALPHA;
            const thickness = isHover || isSelectedLane ? 4 : 3;
            const color = hexToRgba(label.color || "#999999", alpha);
            return mergedRects
              .map((rect) => {
                const width = rect.right - rect.left;
                if (width <= 0) return "";
                const top = rect.bottom + topOffset;
                return (
                  '<span class="overlay-underline" data-overlay-ann-id="' +
                  annId +
                  '" style="left:' +
                  String(rect.left) +
                  "px;top:" +
                  String(top) +
                  "px;width:" +
                  String(width) +
                  "px;height:" +
                  String(hitHeight) +
                  "px;--line-thickness:" +
                  String(thickness) +
                  "px;--line-color:" +
                  color +
                  ';"></span>'
                );
              })
              .join("");
          })
          .join("");

        let selectionHtml = "";
        if (state.selectedAnnotationId) {
          const selectedRects = mergeInlineRects(rectsByAnnId[state.selectedAnnotationId] || []);
          selectionHtml = selectedRects
            .map((rect) => {
              const width = rect.right - rect.left;
              const height = rect.bottom - rect.top;
              if (width <= 0 || height <= 0) return "";
              return (
                '<span class="overlay-selection" style="left:' +
                String(rect.left) +
                "px;top:" +
                String(rect.top) +
                "px;width:" +
                String(width) +
                "px;height:" +
                String(height) +
                'px;"></span>'
              );
            })
            .join("");
        }

        overlay.innerHTML = underlineHtml + selectionHtml;
      }
