                  <li class="shortcut-item"><span class="shortcut-keys">Cmd+Enter</span><span>Submit（doc + annotations を verified、次pendingへ）</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Cmd+Z</span><span>Undo</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Cmd+Y / Cmd+Shift+Z</span><span>Redo</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">J / K</span><span>次のDoc / 前のDoc</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Shift+J / Shift+K</span><span>次のpending Doc / 前のpending Doc</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">H / L / ← / →</span><span>前Label / 次Label</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">[ / ]</span><span>関連例 / 注釈一覧 を切り替え</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">N / P / ↓ / ↑</span><span>現在Label内で次 / 前を選択（未選択時は先頭 / 末尾）</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Esc</span><span>選択中Annotationを解除</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">Delete / Backspace</span><span>選択中Annotationを削除</span></li>
                  <li class="shortcut-item"><span class="shortcut-keys">?</span><span>この一覧を開く / 閉じる</span></li>
                </ul>
                <div class="actions">
                  <button class="btn btn-primary" id="shortcut-close">閉じる</button>
                </div>
              </div>
            </div>
          `);
        }
        if (state.flash) overlays.push(`<div class="flash">${escapeHtml(state.flash)}</div>`);
        return overlays.join("");
      }

      function render() {
        const route = parseHash();
        const app = document.getElementById("app");
        if (!app) return;
        bindKeyboardShortcuts();
        const laneTooltip = document.getElementById("lane-hover-tooltip");
        if (laneTooltip) {
          laneTooltip.classList.remove("show");
          laneTooltip.setAttribute("aria-hidden", "true");
        }
        const docTooltip = document.getElementById("doc-hover-tooltip");
        if (docTooltip) {
          docTooltip.classList.remove("show");
          docTooltip.setAttribute("aria-hidden", "true");
        }
        const relatedTooltip = document.getElementById("related-hover-tooltip");
        if (relatedTooltip) {
          relatedTooltip.classList.remove("show");
          relatedTooltip.setAttribute("aria-hidden", "true");
        }
        if (route.view === "projects") {
          state.currentProjectId = null;
          state.hoverLaneAnnId = null;
          syncDocOverlayTracking(null);
          app.innerHTML = renderProjects() + renderOverlay();
          bindCommonEvents();
          return;
        }
        ensureWorkspaceState(route.projectId);
        const project = getCurrentProject();
        if (!project) {
          location.hash = "#/projects";
          return;
        }
        if (route.view === "workspace") {
          app.innerHTML = renderWorkspace(project) + renderOverlay();
        } else if (route.view === "settings") {
          syncDocOverlayTracking(null);
          app.innerHTML = renderSettings(project) + renderOverlay();
        } else {
          location.hash = "#/projects/" + encodeURIComponent(project.id);
          return;
        }
        bindCommonEvents();
      }

      function requestDocSwitch(nextDocId) {
        if (nextDocId === state.selectedDocId) return;
        if (state.dirty) {
          state.pendingDocSwitchId = nextDocId;
          state.pendingNavigationHash = null;
          state.showUnsavedDialog = true;
          render();
          return;
        }
        applyDocSwitch(nextDocId);
      }

      function applyDocSwitch(nextDocId) {
        state.selectedDocId = nextDocId;
        state.rightPanelTab = "related";
        state.hoverLaneAnnId = null;
        state.showUnsavedDialog = false;
        state.pendingDocSwitchId = null;
        state.pendingNavigationHash = null;
        state.selectedAnnotationId = null;
        render();
      }

      function requestNavigation(nextHash) {
        if (!nextHash || location.hash === nextHash) return;
        if (nextHash === "#/projects" && state.dirty) {
          state.pendingDocSwitchId = null;
          state.pendingNavigationHash = nextHash;
          state.showUnsavedDialog = true;
          render();
          return;
        }
        location.hash = nextHash;
      }

      function moveDocumentByDirection(direction, pendingOnly) {
        const project = getCurrentProject();
        const currentDoc = getCurrentDocument();
        if (!project) return;
        const sortedDocs = getVisibleDocuments(project);
        if (!currentDoc) {
          if (sortedDocs.length === 0) return;
          requestDocSwitch(direction > 0 ? sortedDocs[0].id : sortedDocs[sortedDocs.length - 1].id);
          return;
        }
        const currentIndex = sortedDocs.findIndex((item) => item.id === currentDoc.id);
        if (currentIndex < 0) {
          if (sortedDocs.length === 0) return;
          requestDocSwitch(direction > 0 ? sortedDocs[0].id : sortedDocs[sortedDocs.length - 1].id);
          return;
        }
        let idx = currentIndex + direction;
        while (idx >= 0 && idx < sortedDocs.length) {
          const candidate = sortedDocs[idx];
          if (!pendingOnly || candidate.status === "pending") {
            requestDocSwitch(candidate.id);
            return;
          }
          idx += direction;
        }
        showFlash(pendingOnly ? "移動先のpending docがない" : "移動先のdocがない");
      }

      function moveLabelByDirection(direction) {
        const project = getCurrentProject();
        if (!project || project.labels.length === 0) return;
        const currentIndex = project.labels.findIndex((label) => label.id === state.focusedLabelId);
        const base = currentIndex >= 0 ? currentIndex : 0;
        const nextIndex = base + direction;
        if (nextIndex < 0 || nextIndex >= project.labels.length) return;
        state.focusedLabelId = project.labels[nextIndex].id;
        state.selectedAnnotationId = null;
        state.hoverLaneAnnId = null;
        render();
      }

      function moveRightPanelTabByDirection(direction) {
        const tabs = ["related", "annotationList"];
        const currentIndex = tabs.indexOf(state.rightPanelTab);
        const base = currentIndex >= 0 ? currentIndex : 0;
        const nextIndex = base + direction;
        if (nextIndex < 0 || nextIndex >= tabs.length) return;
        state.rightPanelTab = tabs[nextIndex];
        render();
      }

      function moveAnnotationByDirection(direction, options) {
        const project = getCurrentProject();
        const doc = getCurrentDocument();
        if (!project || !doc || doc.annotations.length === 0) return;
        const allowCrossGroup = !!(options && options.allowCrossGroup);
        const focusedLabelId = state.focusedLabelId;
        const orderedAll = getAnnotationsInPanelOrder(doc, project);
        const ordered = orderedAll.filter((item) => item.labelId === focusedLabelId);
        if (!allowCrossGroup && ordered.length === 0) {
          showFlash("現在LabelにAnnotationがない");
          return;
        }
        const current = doc.annotations.find((item) => item.id === state.selectedAnnotationId) || null;
        let next = null;

        if (allowCrossGroup) {
          const currentIndex = current ? orderedAll.findIndex((item) => item.id === current.id) : -1;
          if (currentIndex >= 0) {
            const nextIndex = currentIndex + direction;
            if (nextIndex < 0 || nextIndex >= orderedAll.length) return;
            next = orderedAll[nextIndex] || null;
          } else if (ordered.length > 0) {
            next = direction > 0 ? ordered[0] : ordered[ordered.length - 1];
          } else {
            next = direction > 0 ? orderedAll[0] : orderedAll[orderedAll.length - 1];
          }
        } else {
          const hasSameLabelSelection = !!(current && current.labelId === focusedLabelId);
          const currentIndex = hasSameLabelSelection ? ordered.findIndex((item) => item.id === current.id) : -1;
          let nextIndex = currentIndex + direction;
          if (currentIndex < 0) {
            nextIndex = direction > 0 ? 0 : ordered.length - 1;
          }
          if (nextIndex < 0 || nextIndex >= ordered.length) return;
          next = ordered[nextIndex] || null;
        }
        if (!next) return;
        state.selectedAnnotationId = next.id;
        state.focusedLabelId = next.labelId;
        render();
      }

      function deleteSelectedAnnotation() {
        const project = getCurrentProject();
        const doc = getCurrentDocument();
        if (!project || !doc || !state.selectedAnnotationId) return;
        const deleteTargetId = state.selectedAnnotationId;
        const listBefore = getAnnotationsInPanelOrder(doc, project);
        const selectedOrderIndex = listBefore.findIndex((item) => item.id === deleteTargetId);
        const removeIndex = doc.annotations.findIndex((item) => item.id === deleteTargetId);
        if (removeIndex < 0) return;
        doc.annotations.splice(removeIndex, 1);
        touchDoc(doc);
        setDirty();
        const listAfter = listBefore.filter((item) => item.id !== deleteTargetId);
        if (listAfter.length === 0) {
          state.selectedAnnotationId = null;
        } else {
          const nextIndex = Math.min(Math.max(selectedOrderIndex, 0), listAfter.length - 1);
          const next = listAfter[nextIndex];
          state.selectedAnnotationId = next.id;
          state.focusedLabelId = next.labelId;
        }
        state.hoverLaneAnnId = null;
        pushWorkspaceHistory();
        showFlash("選択中Annotationを削除した");
      }

      function normalizeWorkspaceSelection(project) {
        if (!project) return;
        ensureProjectConfig(project);
        if (!project.documents.some((item) => item.id === state.selectedDocId)) {
          state.selectedDocId = project.documents[0] ? project.documents[0].id : null;
        }
        if (!project.labels.some((item) => item.id === state.focusedLabelId)) {
          state.focusedLabelId = project.labels[0] ? project.labels[0].id : null;
        }
        const doc = getCurrentDocument();
        if (!doc || !doc.annotations.some((item) => item.id === state.selectedAnnotationId)) {
          state.selectedAnnotationId = null;
        }
        const nextAccordionOpen = {};
        project.labels.forEach((label) => {
          const savedOpen = state.accordionOpen[label.id];
          nextAccordionOpen[label.id] = typeof savedOpen === "boolean" ? savedOpen : true;
        });
        state.accordionOpen = nextAccordionOpen;
        state.hoverLaneAnnId = null;
      }

      function normalizeMeta(value) {
        if (!value || typeof value !== "object" || Array.isArray(value)) return {};
        return deepClone(value);
      }

      function hasRangeOverlap(ranges, start, end) {
        return ranges.some(([existingStart, existingEnd]) => existingStart < end && existingEnd > start);
      }

      function buildProjectExportPayload(project, includePending, includeVerified) {
        const allowedStatuses = new Set();
        if (includePending) allowedStatuses.add("pending");
        if (includeVerified) allowedStatuses.add("verified");
        const labelById = Object.fromEntries(project.labels.map((label) => [label.id, label]));
        const projectMeta = normalizeMeta(project.meta);
        projectMeta.guideline = project.guideline || "";
        projectMeta.shortcut_help_enabled = project.shortcutHelpEnabled !== false;

        const labels = project.labels.map((label) => ({
          id: label.id,
          project_id: project.id,
          project_name: project.name,
          name: label.name,
          color: label.color,
          description: label.description || "",
          shortcut: label.shortcut || null,
          meta: normalizeMeta(label.meta),
        }));

        const documents = project.documents.map((doc) => ({
          id: doc.id,
          project_id: project.id,
          project_name: project.name,
          document_name: doc.documentName,
          text: doc.text,
          annotations: doc.annotations
            .filter((ann) => allowedStatuses.size === 0 || allowedStatuses.has(ann.status))
            .map((ann) => {
              const label = labelById[ann.labelId];
              return {
                id: ann.id,
                document_id: doc.id,
                document_name: doc.documentName,
                label_id: ann.labelId,
                label_name: label ? label.name : "",
                start: ann.start,
                end: ann.end,
                span_text: ann.spanText,
                comment: ann.comment || "",
                status: ann.status || "pending",
                meta: normalizeMeta(ann.meta),
              };
            }),
          meta: normalizeMeta(doc.meta),
        }));

        return {
          project: {
            id: project.id,
            name: project.name,
            description: project.description || "",
            meta: projectMeta,
          },
          labels,
          documents,
          meta: { format: EXPORT_FORMAT, version: EXPORT_VERSION },
        };
      }

      function validateImportPayload(project, payload) {
        if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
          throw new Error("Invalid import payload");
        }
        const incomingProject = payload.project && typeof payload.project === "object" ? payload.project : {};
        const incomingLabels = Array.isArray(payload.labels) ? payload.labels : [];
        const incomingDocuments = Array.isArray(payload.documents) ? payload.documents : [];
        const incomingMeta =
          payload.meta && typeof payload.meta === "object" && !Array.isArray(payload.meta) ? payload.meta : {};

        if (incomingMeta.format && incomingMeta.format !== EXPORT_FORMAT) {
          throw new Error("Invalid import format");
        }
        if (incomingMeta.version && incomingMeta.version !== EXPORT_VERSION) {
          throw new Error("Unsupported import version");
        }

        const existingLabels =
          project && Array.isArray(project.labels) ? project.labels : [];
        const existingDocuments =
          project && Array.isArray(project.documents) ? project.documents : [];
        const existingLabelByName = Object.fromEntries(existingLabels.map((label) => [label.name, label]));
        const incomingLabelNames = incomingLabels.map((label) => String((label && label.name) || ""));
        if (incomingLabelNames.some((name) => !name)) {
          throw new Error("Label name is required");
        }
        if (new Set(incomingLabelNames).size !== incomingLabelNames.length) {
          throw new Error("Duplicate label names in import payload");
        }
        if (incomingLabelNames.some((name) => !!existingLabelByName[name])) {
          throw new Error("Label name already exists in this project");
        }

        const existingDocumentNames = new Set(existingDocuments.map((doc) => doc.documentName));
        const incomingDocumentNames = incomingDocuments.map((doc) => String((doc && doc.document_name) || ""));
        if (incomingDocumentNames.some((name) => !name)) {
          throw new Error("Document name is required");
        }
        if (new Set(incomingDocumentNames).size !== incomingDocumentNames.length) {
          throw new Error("Duplicate document names in import payload");
        }
        if (incomingDocumentNames.some((name) => existingDocumentNames.has(name))) {
          throw new Error("Document name already exists in this project");
        }

        const labelNamesSet = new Set([...Object.keys(existingLabelByName), ...incomingLabelNames]);
        incomingDocuments.forEach((doc) => {
          const text = typeof doc.text === "string" ? doc.text : "";
          const rangesByLabelName = {};
          const annotations = Array.isArray(doc.annotations) ? doc.annotations : [];
          annotations.forEach((ann) => {
            const labelName = ann ? ann.label_name : null;
            if (!labelNamesSet.has(labelName)) {
              throw new Error("Annotation refers to unknown label_name");
            }
            if (!ann || ann.start == null || ann.end == null || ann.span_text == null) {
              throw new Error("Annotation span is incomplete");
            }
            const start = Number(ann.start);
            const end = Number(ann.end);
            if (
              !Number.isInteger(start) ||
              !Number.isInteger(end) ||
              start < 0 ||
              end < start ||
              end > text.length
            ) {
              throw new Error("Annotation span is incomplete");
            }
            if (text.slice(start, end) !== ann.span_text) {
              throw new Error("span_text does not match the specified range");
            }
            if (ann.status !== "pending" && ann.status !== "verified") {
              throw new Error("Invalid annotation status");
            }
            const labelRanges = rangesByLabelName[labelName] || [];
            if (hasRangeOverlap(labelRanges, start, end)) {
              throw new Error("Overlapping annotation span for the same label is not allowed");
            }
            labelRanges.push([start, end]);
            rangesByLabelName[labelName] = labelRanges;
          });
        });

        return {
          incomingProject,
          incomingLabels,
          incomingDocuments,
        };
      }

      function appendImportedEntities(project, incomingLabels, incomingDocuments) {
        const labelIdByName = Object.fromEntries(project.labels.map((label) => [label.name, label.id]));
        incomingLabels.forEach((label) => {
          const created = {
            id: makeId("label"),
            name: label.name,
            color: label.color || "#8b94a0",
            description: label.description || "",
            shortcut: label.shortcut || null,
            meta: normalizeMeta(label.meta),
          };
          project.labels.push(created);
          labelIdByName[created.name] = created.id;
        });

        const now = Date.now();
        let importedAnnotations = 0;
        incomingDocuments.forEach((doc, docIndex) => {
          const createdDoc = {
            id: makeId("doc"),
            documentName: doc.document_name,
            text: typeof doc.text === "string" ? doc.text : "",
            status: "pending",
            createdAt: now + docIndex,
            updatedAt: now + docIndex,
            meta: normalizeMeta(doc.meta),
            annotations: [],
          };
          const annotations = Array.isArray(doc.annotations) ? doc.annotations : [];
          annotations.forEach((ann) => {
            const labelId = labelIdByName[ann.label_name];
            if (!labelId) return;
            createdDoc.annotations.push({
              id: makeId("ann"),
              labelId,
              start: ann.start,
              end: ann.end,
              spanText: ann.span_text,
              comment: ann.comment || "",
              status: ann.status,
              meta: normalizeMeta(ann.meta),
            });
            importedAnnotations += 1;
          });
          project.documents.push(createdDoc);
        });

        return {
          labels: incomingLabels.length,
          documents: incomingDocuments.length,
          annotations: importedAnnotations,
        };
      }

      function importProjectPayload(project, payload) {
        const { incomingLabels, incomingDocuments } = validateImportPayload(project, payload);
        return appendImportedEntities(project, incomingLabels, incomingDocuments);
      }

      function resolveImportedProjectName(baseName) {
        const normalized = String(baseName || "").trim();
        if (!normalized) {
          throw new Error("Project name is required");
        }
        const existingNames = new Set(state.projects.map((project) => project.name));
        if (!existingNames.has(normalized)) return normalized;
        let candidate = normalized + " (imported)";
        let suffix = 2;
        while (existingNames.has(candidate)) {
          candidate = normalized + " (imported " + suffix + ")";
          suffix += 1;
        }
        return candidate;
      }

      function createProjectFromImportPayload(payload) {
        const { incomingProject, incomingLabels, incomingDocuments } = validateImportPayload(null, payload);
        const importedMeta = normalizeMeta(incomingProject.meta);
        const project = {
          id: makeId("project"),
          name: resolveImportedProjectName(incomingProject.name),
          description: incomingProject.description != null ? String(incomingProject.description) : "",
          meta: importedMeta,
          guideline: typeof importedMeta.guideline === "string" ? importedMeta.guideline : "",
          shortcutHelpEnabled:
            typeof importedMeta.shortcut_help_enabled === "boolean" ? importedMeta.shortcut_help_enabled : true,
          labels: [],
          documents: [],
        };
        const counts = appendImportedEntities(project, incomingLabels, incomingDocuments);
        ensureProjectConfig(project);
        return { project, counts };
      }

      function buildExportFilename(projectName) {
        const rawName = String(projectName || "project").trim();
        const safeName = rawName.replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_").slice(0, 80) || "project";
        const d = new Date();
        const datePart =
          String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
        return safeName + "-export-" + datePart + ".json";
      }

      function downloadJsonFile(filename, payload) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      async function readJsonFile(file) {
        const text = await file.text();
        try {
          return JSON.parse(text);
        } catch (_err) {
          throw new Error("JSONのパースに失敗した");
        }
      }

      function isEditingElement(target) {
        if (!target || !(target instanceof HTMLElement)) return false;
        const tag = target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
        return target.isContentEditable;
      }

      function isShortcutHelpKey(event) {
        return event.key === "?" || (event.key === "/" && event.shiftKey);
      }

      function bindKeyboardShortcuts() {
        if (keyboardShortcutsBound) return;
        keyboardShortcutsBound = true;
        window.addEventListener("keydown", (event) => {
          const route = parseHash();
          if (route.view === "projects") return;
          const isWorkspaceView = route.view === "workspace";
          const project = getCurrentProject();
          const shortcutHelpEnabled = !project || project.shortcutHelpEnabled !== false;

          if (state.showShortcutModal) {
            if (event.key === "Escape" || isShortcutHelpKey(event)) {
              event.preventDefault();
              state.showShortcutModal = false;
              render();
            }
            return;
          }

          if (isShortcutHelpKey(event) && shortcutHelpEnabled) {
            event.preventDefault();
            state.showShortcutModal = true;
            render();
            return;
          }

          if (state.showCreateDocModal || state.showUnsavedDialog) return;
          if (isEditingElement(document.activeElement)) return;

          const hasPrimaryModifier = event.metaKey || event.ctrlKey;
          const keyLower = String(event.key || "").toLowerCase();
          if (hasPrimaryModifier && keyLower === "z") {
            event.preventDefault();
            if (event.shiftKey) {
              redoWorkspace();
            } else {
              undoWorkspace();
            }
            return;
          }
          if (hasPrimaryModifier && keyLower === "y") {
            event.preventDefault();
            redoWorkspace();
            return;
          }
          if (hasPrimaryModifier && keyLower === "s") {
            event.preventDefault();
            saveChanges();
            return;
          }
          if (hasPrimaryModifier && event.key === "Enter") {
            event.preventDefault();
            submitCurrentDocument();
            return;
          }

          if (event.metaKey || event.ctrlKey || event.altKey) return;
          if (!isWorkspaceView) return;

          if (event.key === "Escape") {
            if (state.selectedAnnotationId !== null) {
              event.preventDefault();
              state.selectedAnnotationId = null;
              render();
            }
            return;
          }
          if (event.key === "Delete" || event.key === "Backspace") {
            if (state.selectedAnnotationId !== null) {
              event.preventDefault();
              deleteSelectedAnnotation();
            }
            return;
          }
          if (keyLower === "j") {
            event.preventDefault();
            moveDocumentByDirection(1, event.shiftKey);
            return;
          }
          if (keyLower === "k") {
            event.preventDefault();
            moveDocumentByDirection(-1, event.shiftKey);
            return;
          }
          if (keyLower === "h" || event.key === "ArrowLeft") {
            event.preventDefault();
            moveLabelByDirection(-1);
            return;
          }
          if (keyLower === "l" || event.key === "ArrowRight") {
            event.preventDefault();
            moveLabelByDirection(1);
            return;
          }
          if (event.key === "[") {
            event.preventDefault();
            moveRightPanelTabByDirection(-1);
            return;
          }
          if (event.key === "]") {
            event.preventDefault();
            moveRightPanelTabByDirection(1);
            return;
          }
          if (keyLower === "n") {
            event.preventDefault();
            moveAnnotationByDirection(1);
            return;
          }
          if (keyLower === "p") {
            event.preventDefault();
            moveAnnotationByDirection(-1);
            return;
          }
          if (event.key === "ArrowDown") {
            event.preventDefault();
            moveAnnotationByDirection(1, { allowCrossGroup: true });
            return;
          }
          if (event.key === "ArrowUp") {
            event.preventDefault();
            moveAnnotationByDirection(-1, { allowCrossGroup: true });
          }
        });
      }

      function getTextOffset(container, node, offset) {
        const range = document.createRange();
        range.setStart(container, 0);
        range.setEnd(node, offset);
        return range.toString().length;
      }

      function mergeInlineRects(rects) {
        const sorted = [...rects]
          .filter((rect) => rect.width > 0 && rect.height > 0)
          .sort((a, b) => (a.top !== b.top ? a.top - b.top : a.left - b.left));
        const merged = [];
        sorted.forEach((rect) => {
          const last = merged[merged.length - 1];
          const isSameLine =
            last &&
            Math.abs(last.top - rect.top) <= 1 &&
            Math.abs(last.bottom - rect.bottom) <= 1 &&
            rect.left <= last.right + 2;
          if (isSameLine) {
            last.right = Math.max(last.right, rect.right);
            return;
          }
          merged.push({
            left: rect.left,
            right: rect.right,
            top: rect.top,
            bottom: rect.bottom,
          });
        });
        return merged;
      }

      function applyOverlayUnderlineState(overlay) {
        if (!overlay) return;
        overlay.querySelectorAll("[data-overlay-ann-id]").forEach((line) => {
          const annId = line.getAttribute("data-overlay-ann-id");
          const color = line.getAttribute("data-overlay-color") || "#999999";
          const isHover = state.hoverLaneAnnId === annId;
          const isSelectedLane = state.selectedAnnotationId === annId;
          const alpha = isHover || isSelectedLane ? 1 : state.hoverLaneAnnId ? UNDERLINE_DIM_ALPHA : UNDERLINE_IDLE_ALPHA;
          const thickness = isHover || isSelectedLane ? 4 : 3;
          line.style.setProperty("--line-thickness", String(thickness) + "px");
          line.style.setProperty("--line-color", hexToRgba(color, alpha));
        });
      }

      function renderDocOverlay(docText) {
        const overlay = document.getElementById("doc-overlay");
        const doc = getCurrentDocument();
        const project = getCurrentProject();
        if (!overlay || !docText || !doc || !project) {
          if (overlay) overlay.innerHTML = "";
          return;
        }

        const baseRect = docText.getBoundingClientRect();
        const rectsByAnnId = {};
        docText.querySelectorAll("[data-cover-ann-ids]").forEach((segment) => {
          const coverIds = parseCsvIds(segment.getAttribute("data-cover-ann-ids"));
          if (coverIds.length === 0) return;
          const rects = Array.from(segment.getClientRects()).map((rect) => ({
            left: rect.left - baseRect.left,
            right: rect.right - baseRect.left,
            top: rect.top - baseRect.top,
            bottom: rect.bottom - baseRect.top,
            width: rect.width,
            height: rect.height,
          }));
          coverIds.forEach((annId) => {
            if (!rectsByAnnId[annId]) rectsByAnnId[annId] = [];
            rectsByAnnId[annId].push(...rects);
          });
        });

        const annById = Object.fromEntries(doc.annotations.map((ann) => [ann.id, ann]));
        const labelById = Object.fromEntries(project.labels.map((label) => [label.id, label]));
        const laneByAnnId = state.underlineLaneByAnnId || {};
        const hitHeight = UNDERLINE_HIT_HALF * 2;

        const underlineHtml = Object.keys(laneByAnnId)
          .map((annId) => {
            const ann = annById[annId];
            if (!ann) return "";
            const label = labelById[ann.labelId];
            if (!label) return "";
            const mergedRects = mergeInlineRects(rectsByAnnId[annId] || []);
            if (mergedRects.length === 0) return "";
            const laneIndex = laneByAnnId[annId] || 0;
            const distanceFromText = UNDERLINE_LANE_BASE + laneIndex * UNDERLINE_LANE_PITCH;
            const topOffset = distanceFromText - hitHeight / 2;
            const isSelectedLane = state.selectedAnnotationId === annId;
            const thickness = isSelectedLane ? 4 : 3;
            const color = hexToRgba(label.color || "#999999", isSelectedLane ? 1 : UNDERLINE_IDLE_ALPHA);
            return mergedRects
              .map((rect) => {
                const width = rect.right - rect.left;
                if (width <= 0) return "";
                const top = rect.bottom + topOffset;
                return (
                  '<span class="overlay-underline" data-overlay-ann-id="' +
                  annId +
                  '" data-overlay-color="' +
                  escapeHtml(label.color || "#999999") +
                  '" style="left:' +
                  String(rect.left) +
                  "px;top:" +
                  String(top) +
                  "px;width:" +
                  String(width) +
                  "px;height:" +
                  String(hitHeight) +
                  "px;--line-thickness:" +
                  String(thickness) +
                  "px;--line-color:" +
                  color +
                  ';"></span>'
                );
              })
              .join("");
          })
          .join("");

        let selectionHtml = "";
        if (state.selectedAnnotationId) {
          const selectedRects = mergeInlineRects(rectsByAnnId[state.selectedAnnotationId] || []);
          selectionHtml = selectedRects
            .map((rect) => {
              const width = rect.right - rect.left;
              const height = rect.bottom - rect.top;
              if (width <= 0 || height <= 0) return "";
              return (
                '<span class="overlay-selection" style="left:' +
                String(rect.left) +
                "px;top:" +
                String(rect.top) +
                "px;width:" +
                String(width) +
                "px;height:" +
                String(height) +
                'px;"></span>'
              );
            })
            .join("");
        }

        overlay.innerHTML = underlineHtml + selectionHtml;
      }

            });

                : null);

              showFlash("ImportするJSONファイルを選択する");

        const unsavedButtons = document.querySelectorAll("[data-unsaved-action]");
        if (unsavedButtons.length === 0) return;
        unsavedButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.getAttribute("data-unsaved-action");
            const pendingId = state.pendingDocSwitchId;
            const pendingHash = state.pendingNavigationHash;
            if (action === "cancel") {
              state.showUnsavedDialog = false;
              state.pendingDocSwitchId = null;
              state.pendingNavigationHash = null;
              render();
              return;
            }
            if (action === "discard") {
              restoreCurrentProject();
              state.dirty = false;
              state.showUnsavedDialog = false;
              state.pendingDocSwitchId = null;
              state.pendingNavigationHash = null;
              if (pendingId) {
                state.selectedDocId = pendingId;
                state.selectedAnnotationId = null;
                resetWorkspaceHistory();
                render();
                return;
              }
              if (pendingHash) {
                location.hash = pendingHash;
                return;
              }
              resetWorkspaceHistory();
              render();
              return;
            }
            if (action === "save") {
              saveCurrentProjectSnapshot();
              state.dirty = false;
              state.showUnsavedDialog = false;
              state.pendingDocSwitchId = null;
              state.pendingNavigationHash = null;
              if (pendingId) {
                state.selectedDocId = pendingId;
                state.selectedAnnotationId = null;
                pushWorkspaceHistory();
                render();
                return;
              }
              if (pendingHash) {
                location.hash = pendingHash;
                return;
              }
              pushWorkspaceHistory();
              render();
            }
          });
        });
      }

      function bindShortcutEvents() {
        const shortcutClose = document.getElementById("shortcut-close");
        if (shortcutClose) {
          shortcutClose.addEventListener("click", () => {
            state.showShortcutModal = false;
            render();
          });
        }

        const shortcutOpen = document.getElementById("shortcut-open");
        if (shortcutOpen) {
          shortcutOpen.addEventListener("click", () => {
            state.showShortcutModal = true;
            render();
          });
        }
      }

      function bindCanvasEvents() {
        const docText = document.getElementById("doc-text");
        if (!docText) {
          syncDocOverlayTracking(null);
          return;
        }

        syncDocOverlayTracking(docText);
        renderDocOverlay(docText);
        const overlay = document.getElementById("doc-overlay");
        applyOverlayUnderlineState(overlay);
        const laneTooltip = document.getElementById("lane-hover-tooltip");
        const laneTooltipDot = document.getElementById("lane-hover-tooltip-dot");
        const laneTooltipText = document.getElementById("lane-hover-tooltip-text");

        const hideLaneTooltip = () => {
          if (!laneTooltip) return;
          laneTooltip.classList.remove("show");
          laneTooltip.setAttribute("aria-hidden", "true");
        };

        const showLaneTooltip = (annId, clientX, clientY) => {
          if (!laneTooltip || !laneTooltipDot || !laneTooltipText) return;
          const project = getCurrentProject();
          const doc = getCurrentDocument();
          if (!project || !doc) {
            hideLaneTooltip();
            return;
          }
          const ann = doc.annotations.find((item) => item.id === annId);
          if (!ann) {
            hideLaneTooltip();
            return;
          }
          const label = project.labels.find((item) => item.id === ann.labelId) || null;
          laneTooltipDot.style.background = label ? label.color || "#8b94a0" : "#8b94a0";
          laneTooltipText.textContent = label ? label.name : "Unknown";
          laneTooltip.classList.add("show");
          laneTooltip.setAttribute("aria-hidden", "false");
          const rect = laneTooltip.getBoundingClientRect();
          let left = clientX + 14;
          let top = clientY + 16;
          if (left + rect.width > window.innerWidth - 8) left = window.innerWidth - rect.width - 8;
          if (top + rect.height > window.innerHeight - 8) top = window.innerHeight - rect.height - 8;
          if (left < 8) left = 8;
          if (top < 8) top = 8;
          laneTooltip.style.left = String(left) + "px";
          laneTooltip.style.top = String(top) + "px";
        };

        const syncUnderlineHover = (nextLaneAnnId) => {
          if (state.hoverLaneAnnId === nextLaneAnnId) return;
          state.hoverLaneAnnId = nextLaneAnnId;
          applyOverlayUnderlineState(overlay);
        };

        if (overlay) {
          overlay.addEventListener("mousemove", (event) => {
            const line = event.target.closest("[data-overlay-ann-id]");
            if (!line || !overlay.contains(line)) {
              syncUnderlineHover(null);
              hideLaneTooltip();
              return;
            }
            const annId = line.getAttribute("data-overlay-ann-id");
            syncUnderlineHover(annId);
            showLaneTooltip(annId, event.clientX, event.clientY);
          });

          overlay.addEventListener("mouseleave", () => {
            syncUnderlineHover(null);
            hideLaneTooltip();
          });

          overlay.addEventListener("click", (event) => {
            const line = event.target.closest("[data-overlay-ann-id]");
            if (!line || !overlay.contains(line)) return;
            event.stopPropagation();
            const selection = window.getSelection();
            if (selection && !selection.isCollapsed) return;
            const annId = line.getAttribute("data-overlay-ann-id");
            const doc = getCurrentDocument();
            if (!doc) return;
            const ann = doc.annotations.find((item) => item.id === annId);
            if (!ann) return;
            state.selectedAnnotationId = ann.id;
            state.focusedLabelId = ann.labelId;
            render();
          });
        }

        const clearAnnotationSelection = () => {
          if (state.selectedAnnotationId === null) return;
          state.selectedAnnotationId = null;
          render();
        };

        const canvasWrap = docText.closest(".canvas-wrap");
        if (canvasWrap) {
          canvasWrap.addEventListener("click", (event) => {
            const selection = window.getSelection();
            if (selection && !selection.isCollapsed) return;
            const underline = event.target.closest("[data-overlay-ann-id]");
            if (underline && canvasWrap.contains(underline)) return;
            const segment = event.target.closest("[data-primary-ann-id]");
            if (segment && docText.contains(segment)) return;
            clearAnnotationSelection();
          });
        }

        docText.addEventListener("mousemove", (event) => {
          const selection = window.getSelection();
          if (selection && !selection.isCollapsed) {
            syncUnderlineHover(null);
            hideLaneTooltip();
            return;
          }
          const segment = event.target.closest("[data-primary-ann-id]");
          if (!segment || !docText.contains(segment)) {
            syncUnderlineHover(null);
            hideLaneTooltip();
            return;
          }
          syncUnderlineHover(null);
          const doc = getCurrentDocument();
          if (!doc) {
            hideLaneTooltip();
            return;
          }
          const primaryAnnId = segment.getAttribute("data-primary-ann-id");
          const primaryAnn = doc.annotations.find((item) => item.id === primaryAnnId);
          if (!primaryAnn || primaryAnn.labelId !== state.focusedLabelId) {
            hideLaneTooltip();
            return;
          }
          showLaneTooltip(primaryAnn.id, event.clientX, event.clientY);
        });

        docText.addEventListener("mouseleave", () => {
          syncUnderlineHover(null);
          hideLaneTooltip();
        });

        docText.addEventListener("mouseup", () => {
          const selection = window.getSelection();
          if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return;
          const range = selection.getRangeAt(0);
          if (!docText.contains(range.startContainer) || !docText.contains(range.endContainer)) return;
          const doc = getCurrentDocument();
          const label = getFocusedLabel();
          if (!doc || !label) return;
          let start = getTextOffset(docText, range.startContainer, range.startOffset);
          let end = getTextOffset(docText, range.endContainer, range.endOffset);
          if (start > end) {
            const temp = start;
            start = end;
            end = temp;
          }
          if (start === end) return;
          const spanText = doc.text.slice(start, end);
          if (!spanText.trim()) {
            selection.removeAllRanges();
            return;
          }
          if (hasOverlap(doc.annotations, label.id, start, end)) {
            selection.removeAllRanges();
            showFlash("同一ラベルの重複範囲は作成できない");
            return;
          }
          const newAnnotation = {
            id: makeId("ann"),
            labelId: label.id,
            start,
            end,
            spanText,
            comment: "",
            status: "pending",
            meta: {},
          };
          doc.annotations.push(newAnnotation);
          touchDoc(doc);
          setDirty();
          state.selectedAnnotationId = newAnnotation.id;
          selection.removeAllRanges();
          pushWorkspaceHistory();
          render();
        });
      }

      function bindCommonEvents() {
        bindProjectImportEvents();
        bindNavigationEvents();
        bindWorkspaceControls();
        bindSettingsControls();
        bindProjectDataIoEvents();
        bindUnsavedDialogEvents();
        bindShortcutEvents();
        bindCanvasEvents();
      }

      window.addEventListener("hashchange", render);
      if (!location.hash) location.hash = "#/projects";
      render();
    </script>
  </body>
</html>
