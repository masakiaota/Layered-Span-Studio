[project]
name = "layered-span-studio-backend"
version = "0.2.1"
description = "Layered Span Studio backend API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Masaki Aota" }]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "httpx>=0.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
